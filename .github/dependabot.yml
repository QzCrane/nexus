version: 2
updates:
  - package-ecosystem: bun
    directory: "/nexus"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      biome:
        patterns: ["@biomejs/*"]
      typescript:
        patterns: ["typescript", "@types/*", "chrome-types"]
      build-tools:
        patterns: ["esbuild", "turbo", "terser", "sharp"]
    commit-message:
      prefix: chore(deps)
      include: scope
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
      include: scope
