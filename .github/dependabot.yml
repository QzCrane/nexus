version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps-root)"

  - package-ecosystem: bun
    directory: /nexus
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: auto
    commit-message:
      prefix: "chore(actions)"
    groups:
      workflow-actions:
        patterns:
          - "*"
