version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 4
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps-root)"
    groups:
      root-governance-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  - package-ecosystem: bun
    directory: /nexus
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 6
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      nexus-runtime-patch-minor:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      nexus-development-patch-minor:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 4
    rebase-strategy: auto
    commit-message:
      prefix: "chore(actions)"
    groups:
      workflow-actions:
        patterns:
          - "*"
