name: Cross-platform quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revert-negative-spectra-projection:
    name: revert negative SPECTRA projection
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/spectra-halo-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore pre-experiment SPECTRA owners
        run: |
          git fetch origin main
          git checkout origin/main -- \
            nexus/apps/extension-spectra/src/background/control-coordinator.ts \
            nexus/apps/extension-spectra/src/background/runtime-loader.ts \
            nexus/scripts/verify/check-spectra-control.ts
          git rm -f \
            nexus/apps/extension-spectra/src/background/background-control-policy.ts \
            nexus/apps/extension-spectra/test/background-control-policy.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "revert(spectra): drop negative background policy projection"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  quality:
    name: quality (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: nexus/node_modules/.cache/turbo
          key: turbo-quality-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Check platform contract
        run: bun run check:platform

      - name: Check toolchain, docs, and architecture
        run: |
          bun --cwd nexus check:toolchain
          bun run docs:check
          bun run verify:q

      - name: Test AI-tool hooks
        run: bun run hooks:test

      - name: Lint
        run: |
          bun run lint

      - name: Typecheck all workspaces
        run: bun run typecheck

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: nexus/node_modules/.cache/turbo
          key: turbo-build-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}
          restore-keys: |
            turbo-build-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Build production candidates
        run: bun run build

      - name: Test SPECTRA
        run: bun --cwd nexus test:spectra

      - name: Test HALO
        run: bun --cwd nexus test:halo
