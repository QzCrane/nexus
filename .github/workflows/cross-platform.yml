name: Cross-platform quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Check platform contract
        run: bun run check:platform

      - name: Check toolchain and repository structure
        run: |
          bun --cwd nexus run check:toolchain
          bun run docs:check
          bun run verify:q

      - name: Test process, path, and source contracts
        run: |
          bun run hooks:test
          bun --cwd nexus run test:spectra

      - name: Check types and lint
        run: |
          bun run typecheck
          bun run lint

      - name: Build production candidates
        run: bun run build
