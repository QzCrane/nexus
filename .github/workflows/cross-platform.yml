name: Cross-platform quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: nexus/node_modules/.cache/turbo
          key: turbo-quality-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Check platform contract
        run: bun run check:platform

      - name: Check toolchain, docs, and architecture
        run: |
          bun --cwd nexus check:toolchain
          bun run docs:check
          bun run verify:q

      - name: Test AI-tool hooks
        run: bun run hooks:test

      - name: Lint
        run: |
          bun run lint

      - name: Typecheck all workspaces
        run: bun run typecheck

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: nexus/node_modules/.cache/turbo
          key: turbo-build-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}
          restore-keys: |
            turbo-build-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Build production candidates
        run: bun run build

      - name: Measure Preact SidePanel experiment
        run: bun --cwd nexus/apps/extension-halo build:preact-experiment

      - name: Test SPECTRA
        run: bun --cwd nexus test:spectra

      - name: Test HALO
        run: bun --cwd nexus test:halo

