name: Cross-platform quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      closeout-platform:
        description: Record the canonical exact-head Linux closeout lane only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    if: inputs.closeout-platform != true
    name: product scope (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      spectra: ${{ steps.classify.outputs.spectra }}
      halo: ${{ steps.classify.outputs.halo }}
    steps:
      - name: Checkout history for candidate scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout at start
        run: node nexus/scripts/hosted-execution.mjs start

      - name: Classify product scope
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/pr-changed-paths.z"
          : > "$paths_file"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
              echo "Missing pull-request base/head SHA" >&2
              exit 1
            fi
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"

            merge_bases_file="$RUNNER_TEMP/pr-merge-bases.txt"
            git merge-base --all "$BASE_SHA" "$HEAD_SHA" > "$merge_bases_file"
            mapfile -t merge_bases < "$merge_bases_file"
            if [[ "${#merge_bases[@]}" -ne 1 ]]; then
              echo "Expected exactly one PR merge base; found ${#merge_bases[@]}" >&2
              exit 1
            fi
            git diff --no-renames --name-only -z "${merge_bases[0]}" "$HEAD_SHA" > "$paths_file"
          fi

          node nexus/scripts/ci-product-scope.mjs \
            --event "$GITHUB_EVENT_NAME" \
            --paths-z-file "$paths_file" >> "$GITHUB_OUTPUT"

      - name: Verify exact checkout at end
        if: always()
        run: node nexus/scripts/hosted-execution.mjs end

  quality:
    if: inputs.closeout-platform != true
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout at start
        run: node nexus/scripts/hosted-execution.mjs start

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nexus/.turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}-
            turbo-quality-${{ runner.os }}-

      - name: Freeze repository-governance dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install product-workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Audit frozen dependency domains
        run: bun --cwd nexus audit:dependencies

      - name: Check dependency-domain authority
        run: bun nexus/scripts/check-dependency-domains.ts

      - name: Check platform contract
        run: bun run check:platform

      - name: Check governance closure
        run: bun --cwd nexus check:governance

      - name: Check closeout evidence
        run: bun --cwd nexus check:closeout-evidence

      - name: Check toolchain, docs, and architecture
        run: |
          bun --cwd nexus check:toolchain
          bun run docs:check
          bun run verify:q

      - name: Test AI-tool hooks
        run: bun run hooks:test

      - name: Lint
        run: |
          bun run lint

      - name: Typecheck all workspaces
        run: bun run typecheck

      - name: Bound Turbo cache snapshot
        if: always()
        run: node nexus/scripts/prune-turbo-cache.mjs nexus/.turbo/cache

      - name: Verify exact checkout at end
        if: always()
        run: node nexus/scripts/hosted-execution.mjs end

  closeout-platform:
    if: github.event_name == 'workflow_dispatch' && inputs.closeout-platform == true
    name: exact-head Linux closeout receipt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact checkout at start
        run: node nexus/scripts/hosted-execution.mjs start
      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Materialize the frozen tooling owners
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun install --cwd nexus --frozen-lockfile
      - name: Record through the canonical closeout owner
        run: bun nexus/scripts/closeout-evidence.ts platform-record
      - name: Retain the immutable receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: closeout-platform-${{ github.sha }}
          path: nexus/artifacts/closeout-platform-linux.${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify exact checkout at end
        if: always()
        run: node nexus/scripts/hosted-execution.mjs end

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.spectra == 'true' || needs.scope.outputs.halo == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout at start
        run: node nexus/scripts/hosted-execution.mjs start

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nexus/.turbo/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}-
            turbo-build-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Build all production candidates
        if: needs.scope.outputs.spectra == 'true' && needs.scope.outputs.halo == 'true'
        run: bun run build

      - name: Build SPECTRA production candidate
        if: needs.scope.outputs.spectra == 'true' && needs.scope.outputs.halo != 'true'
        run: bun run --cwd nexus build:spectra

      - name: Build HALO production candidate
        if: needs.scope.outputs.halo == 'true' && needs.scope.outputs.spectra != 'true'
        run: bun run --cwd nexus build:halo

      - name: Test SPECTRA
        if: needs.scope.outputs.spectra == 'true'
        run: bun --cwd nexus test:spectra:dist

      - name: Test HALO
        if: needs.scope.outputs.halo == 'true'
        run: bun --cwd nexus test:halo

      - name: Bound Turbo cache snapshot
        if: always()
        run: node nexus/scripts/prune-turbo-cache.mjs nexus/.turbo/cache

      - name: Verify exact checkout at end
        if: always()
        run: node nexus/scripts/hosted-execution.mjs end
