name: Cross-platform quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: product scope (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      spectra: ${{ steps.classify.outputs.spectra }}
      halo: ${{ steps.classify.outputs.halo }}
    steps:
      - name: Checkout history for candidate scope
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify product scope
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/pr-changed-paths.z"
          : > "$paths_file"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
              echo "Missing pull-request base/head SHA" >&2
              exit 1
            fi
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"

            merge_bases_file="$RUNNER_TEMP/pr-merge-bases.txt"
            git merge-base --all "$BASE_SHA" "$HEAD_SHA" > "$merge_bases_file"
            mapfile -t merge_bases < "$merge_bases_file"
            if [[ "${#merge_bases[@]}" -ne 1 ]]; then
              echo "Expected exactly one PR merge base; found ${#merge_bases[@]}" >&2
              exit 1
            fi
            git diff --no-renames --name-only -z "${merge_bases[0]}" "$HEAD_SHA" > "$paths_file"
          fi

          node nexus/scripts/ci-product-scope.mjs \
            --event "$GITHUB_EVENT_NAME" \
            --paths-z-file "$paths_file" >> "$GITHUB_OUTPUT"

  quality:
    name: quality (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: nexus/.turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}-
            turbo-quality-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Check platform contract
        run: bun run check:platform

      - name: Check governance closure
        run: bun --cwd nexus check:governance

      - name: Check toolchain, docs, and architecture
        run: |
          bun --cwd nexus check:toolchain
          bun run docs:check
          bun run verify:q

      - name: Test AI-tool hooks
        run: bun run hooks:test

      - name: Lint
        run: |
          bun run lint

      - name: Typecheck all workspaces
        run: bun run typecheck

      - name: Bound Turbo cache snapshot
        if: always()
        run: node nexus/scripts/prune-turbo-cache.mjs nexus/.turbo/cache

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.spectra == 'true' || needs.scope.outputs.halo == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: nexus/.turbo/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ hashFiles('nexus/bun.lock') }}-
            turbo-build-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Build all production candidates
        if: needs.scope.outputs.spectra == 'true' && needs.scope.outputs.halo == 'true'
        run: bun run build

      - name: Build SPECTRA production candidate
        if: needs.scope.outputs.spectra == 'true' && needs.scope.outputs.halo != 'true'
        run: bun --cwd nexus run build:spectra

      - name: Build HALO production candidate
        if: needs.scope.outputs.halo == 'true' && needs.scope.outputs.spectra != 'true'
        run: bun --cwd nexus run build:halo

      - name: Test SPECTRA
        if: needs.scope.outputs.spectra == 'true'
        run: bun --cwd nexus test:spectra:dist

      - name: Test HALO
        if: needs.scope.outputs.halo == 'true'
        run: bun --cwd nexus test:halo

      - name: Bound Turbo cache snapshot
        if: always()
        run: node nexus/scripts/prune-turbo-cache.mjs nexus/.turbo/cache
