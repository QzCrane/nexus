name: HALO browser contracts

on:
  pull_request:
    paths:
      - '.github/workflows/halo-keyboard-browser.yml'
      - 'nexus/apps/extension-halo/build.ts'
      - 'nexus/apps/extension-halo/package.json'
      - 'nexus/apps/extension-halo/public/manifest.json'
      - 'nexus/apps/extension-halo/public/sidepanel.html'
      - 'nexus/apps/extension-halo/src/content/smooth-scroll*.ts'
      - 'nexus/apps/extension-halo/src/content/ruler.ts'
      - 'nexus/apps/extension-halo/src/content/dom-selector.ts'
      - 'nexus/apps/extension-halo/src/content/page-annotate.ts'
      - 'nexus/apps/extension-halo/src/content/hover-zoom*.ts'
      - 'nexus/apps/extension-halo/src/entry/content-smooth-scroll.ts'
      - 'nexus/apps/extension-halo/src/entry/content-frame-tools*.ts'
      - 'nexus/apps/extension-halo/src/entry/content-hover-zoom*.ts'
      - 'nexus/apps/extension-halo/src/entry/sidepanel.tsx'
      - 'nexus/apps/extension-halo/src/components/sidepanel/**'
      - 'nexus/apps/extension-halo/src/components/search/**'
      - 'nexus/apps/extension-halo/src/tools/smooth-scroll/**'
      - 'nexus/apps/extension-halo/src/tools/hover-zoom/**'
      - 'nexus/apps/extension-halo/test/smooth-scroll*.spec.ts'
      - 'nexus/apps/extension-halo/test/frame-tools-lazy*.spec.ts'
      - 'nexus/apps/extension-halo/test/hover-zoom-lazy*.spec.ts'
      - 'nexus/apps/extension-halo/test/sidepanel-runtime-playwright.spec.ts'
      - 'nexus/bun.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/halo-keyboard-browser.yml'
      - 'nexus/apps/extension-halo/build.ts'
      - 'nexus/apps/extension-halo/package.json'
      - 'nexus/apps/extension-halo/public/manifest.json'
      - 'nexus/apps/extension-halo/public/sidepanel.html'
      - 'nexus/apps/extension-halo/src/content/smooth-scroll*.ts'
      - 'nexus/apps/extension-halo/src/content/ruler.ts'
      - 'nexus/apps/extension-halo/src/content/dom-selector.ts'
      - 'nexus/apps/extension-halo/src/content/page-annotate.ts'
      - 'nexus/apps/extension-halo/src/content/hover-zoom*.ts'
      - 'nexus/apps/extension-halo/src/entry/content-smooth-scroll.ts'
      - 'nexus/apps/extension-halo/src/entry/content-frame-tools*.ts'
      - 'nexus/apps/extension-halo/src/entry/content-hover-zoom*.ts'
      - 'nexus/apps/extension-halo/src/entry/sidepanel.tsx'
      - 'nexus/apps/extension-halo/src/components/sidepanel/**'
      - 'nexus/apps/extension-halo/src/components/search/**'
      - 'nexus/apps/extension-halo/src/tools/smooth-scroll/**'
      - 'nexus/apps/extension-halo/src/tools/hover-zoom/**'
      - 'nexus/apps/extension-halo/test/smooth-scroll*.spec.ts'
      - 'nexus/apps/extension-halo/test/frame-tools-lazy*.spec.ts'
      - 'nexus/apps/extension-halo/test/hover-zoom-lazy*.spec.ts'
      - 'nexus/apps/extension-halo/test/sidepanel-runtime-playwright.spec.ts'
      - 'nexus/bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: halo-browser-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Build HALO workspace dependencies
        run: bun --cwd nexus build:halo-deps

      - name: Build HALO production candidate
        run: bun --cwd nexus/apps/extension-halo build:prod

      - name: Install Chromium runtime
        working-directory: nexus/apps/extension-halo
        run: bunx playwright install --with-deps --no-shell chromium

      - name: Test HALO browser contracts in Chromium
        run: bun --cwd nexus/apps/extension-halo test:browser-chromium
