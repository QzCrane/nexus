name: Integration final repair checkpoint
on:
  push:
    branches: [codex/nexus-business-preserving-integration]
    paths: ['.github/workflows/integration-repair-checkpoint.yml']
permissions:
  contents: write
jobs:
  retain:
    if: github.repository == 'QzCrane/nexus' && github.ref == 'refs/heads/codex/nexus-business-preserving-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact reviewed source repairs
        env:
          RECIPE: ''
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD^') == 'f874dd8ef44e19eb73c11868b9202dcedba59501'
          raw = base64.b64decode(os.environ['RECIPE'], validate=True)
          assert hashlib.sha256(raw).hexdigest() == '2291874d04be404465f12bc3df5edd638a3235066eeb48cdd79bd52967929f23'
          allowed = {'nexus/apps/extension-spectra/test/performance.spec.ts', 'nexus/closeout-policy.json', 'nexus/docs/release-closeout.md', 'nexus/scripts/closeout-evidence.ts', 'nexus/scripts/closeout-governance.spec.ts'}
          for row in json.loads(lzma.decompress(raw, memlimit=256*1024*1024)):
              name = row['path']; assert name in allowed; allowed.remove(name)
              path = Path(name); assert not path.is_symlink()
              assert git('hash-object', name) == row['source'], name
              old = path.read_text(encoding='utf-8'); parts = []
              for part in row['parts']:
                  if isinstance(part, str): parts.append(part)
                  else:
                      a, b = part; assert 0 <= a <= b <= len(old); parts.append(old[a:b])
              path.write_text(''.join(parts), encoding='utf-8')
              assert git('hash-object', name) == row['target'], name
          assert not allowed
          subprocess.check_call(['git', 'add', '--', 'nexus'])
          assert git('rev-parse', git('write-tree') + ':nexus') == 'be5db6a1f616b8102b9004b238dffe705607a619'
          subprocess.check_call(['git', 'diff', '--cached', '--check'])
          subprocess.check_call(['git', 'diff', '--cached', '--exit-code', '--', '.github'])
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Test the production policy reader
        run: |
          bun install --cwd nexus --frozen-lockfile
          bun test nexus/scripts/closeout-governance.spec.ts
          bun run --cwd nexus lint:repository-surfaces
          git diff --exit-code
      - name: Retain verified repair on the integration branch only
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/nexus-business-preserving-integration
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 664d0615f850c568a8840ac312ca7c92cb81ceee
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'NEXUS integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --exit-code -- .github
          git commit -m 'fix(closeout): bind policy to canonical Bun and benchmark shared user readiness'
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'REPAIR_COMMIT=%s\nPRODUCT_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD:nexus)"
