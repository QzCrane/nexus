name: TEMP HALO keyboard probe patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/halo-scroll-event-ownership-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/halo-scroll-event-ownership-v2
          fetch-depth: 1
      - name: Make probe read persistent event state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('nexus/apps/extension-halo/test/smooth-scroll-keyboard-playwright.spec.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  """\t\t\tlet lastAnyArrowCancelBubble = null;
\t\t\tlet lastAnyArrowDefaultPrevented = null;
\t\t\tlet lastArrowDefaultPrevented = null;
\t\t\tlet lastStopArrowDefaultPrevented = null;
\t\t\tlet lastSpaceDefaultPrevented = null;
""",
                  """\t\t\tlet lastAnyArrowEvent = null;
\t\t\tlet lastArrowEvent = null;
\t\t\tlet lastStopArrowEvent = null;
\t\t\tlet lastSpaceEvent = null;
""",
              ),
              (
                  """\t\t\tdocument.addEventListener('keydown', (event) => {
\t\t\t\tif (event.key !== 'ArrowDown') return;
\t\t\t\tif (event.isTrusted) trustedArrowEvents++;
\t\t\t\tqueueMicrotask(() => {
\t\t\t\t\tlastAnyArrowCancelBubble = event.cancelBubble;
\t\t\t\t\tlastAnyArrowDefaultPrevented = event.defaultPrevented;
\t\t\t\t});
\t\t\t});
""",
                  """\t\t\tdocument.addEventListener('keydown', (event) => {
\t\t\t\tif (event.key !== 'ArrowDown') return;
\t\t\t\tif (event.isTrusted) trustedArrowEvents++;
\t\t\t\tlastAnyArrowEvent = event;
\t\t\t});
""",
              ),
              (
                  """\t\t\t\t\t\tqueueMicrotask(() => {
\t\t\t\t\t\t\tlastArrowDefaultPrevented = event.defaultPrevented;
\t\t\t\t\t\t});
""",
                  """\t\t\t\t\t\tlastArrowEvent = event;
""",
              ),
              (
                  """\t\t\t\t\t\t\tqueueMicrotask(() => {
\t\t\t\t\t\t\t\tlastStopArrowDefaultPrevented = event.defaultPrevented;
\t\t\t\t\t\t\t});
""",
                  """\t\t\t\t\t\t\tlastStopArrowEvent = event;
""",
              ),
              (
                  """\t\t\t\t\t\tqueueMicrotask(() => {
\t\t\t\t\t\t\tlastSpaceDefaultPrevented = event.defaultPrevented;
\t\t\t\t\t\t});
""",
                  """\t\t\t\t\t\tlastSpaceEvent = event;
""",
              ),
              (
                  """\t\t\t\t\tlastAnyArrowCancelBubble = null;
\t\t\t\t\tlastAnyArrowDefaultPrevented = null;
\t\t\t\t\tlastArrowDefaultPrevented = null;
\t\t\t\t\tlastStopArrowDefaultPrevented = null;
\t\t\t\t\tlastSpaceDefaultPrevented = null;
""",
                  """\t\t\t\t\tlastAnyArrowEvent = null;
\t\t\t\t\tlastArrowEvent = null;
\t\t\t\t\tlastStopArrowEvent = null;
\t\t\t\t\tlastSpaceEvent = null;
""",
              ),
              (
                  """\t\t\t\t\t\tlastAnyArrowCancelBubble,
\t\t\t\t\t\tlastAnyArrowDefaultPrevented,
\t\t\t\t\t\tlastArrowDefaultPrevented,
\t\t\t\t\t\tlastSpaceDefaultPrevented,
\t\t\t\t\t\tlastStopArrowDefaultPrevented,
""",
                  """\t\t\t\t\t\tlastAnyArrowCancelBubble: lastAnyArrowEvent?.cancelBubble ?? null,
\t\t\t\t\t\tlastAnyArrowDefaultPrevented: lastAnyArrowEvent?.defaultPrevented ?? null,
\t\t\t\t\t\tlastArrowDefaultPrevented: lastArrowEvent?.defaultPrevented ?? null,
\t\t\t\t\t\tlastSpaceDefaultPrevented: lastSpaceEvent?.defaultPrevented ?? null,
\t\t\t\t\t\tlastStopArrowDefaultPrevented: lastStopArrowEvent?.defaultPrevented ?? null,
""",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'probe anchor count={count}: {old[:60]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nexus/apps/extension-halo/test/smooth-scroll-keyboard-playwright.spec.ts
          git commit -m "test(halo): observe post-dispatch keyboard ownership"
          git push origin HEAD:agent/halo-scroll-event-ownership-v2
