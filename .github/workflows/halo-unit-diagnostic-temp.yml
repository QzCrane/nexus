name: TEMP HALO unit diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit:
    if: github.event.pull_request.head.ref == 'agent/halo-scroll-event-ownership-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd nexus --frozen-lockfile
      - name: HALO unit tail
        shell: bash
        run: |
          set +e
          bun --cwd nexus/apps/extension-halo test:unit > /tmp/halo-unit.log 2>&1
          status=$?
          tail -n 120 /tmp/halo-unit.log
          exit "$status"
