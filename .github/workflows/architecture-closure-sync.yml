name: Architecture closure projection

on:
  push:
    branches:
      - main
    paths:
      - 'nexus/architecture-closure.json'
      - 'nexus/scripts/check-architecture-closure.ts'
      - 'nexus/scripts/render-architecture-closure.ts'
      - '.github/workflows/architecture-closure-sync.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: architecture-closure-projection
  cancel-in-progress: true

jobs:
  project:
    name: Issue #32 projection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Validate canonical closure owner
        run: bun nexus/scripts/check-architecture-closure.ts

      - name: Render Issue projection
        run: bun nexus/scripts/render-architecture-closure.ts --issue-body > "$RUNNER_TEMP/architecture-closure.md"

      - name: Replace Issue #32 body from canonical JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit 32 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/architecture-closure.md"
