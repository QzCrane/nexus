name: Changesets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changeset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'QzCrane/nexus'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Apply changesets
        uses: changesets/action@v1
        with:
          version: bun --cwd nexus run changeset:version
          commit: chore: version packages
          title: chore: version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
