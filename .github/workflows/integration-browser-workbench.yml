name: Integration repair checkpoint
on:
  push:
    branches: [codex/nexus-business-preserving-integration]
    paths: ['.github/workflows/integration-browser-workbench.yml']
permissions:
  contents: write
concurrency:
  group: nexus-integration-repair-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'QzCrane/nexus' && github.ref == 'refs/heads/codex/nexus-business-preserving-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Reconstruct reviewed repairs from immutable source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD^') == '9df643ebc42fbb49ee41628c6c7fe850afffbf9c'
          assert git('rev-parse', 'HEAD:nexus') == '6242894343ac51d472f20bfcdfca07decd032a53'
          blobs = ['531566da86a12a979dc1c8c0f23260d8ba1f2978', '411315e91600f7995a97b31cf2d41e6f78dbb5de']
          chunks = []
          for sha in blobs:
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/QzCrane/nexus/git/blobs/{sha}",
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response: payload = json.load(response)
              assert payload['sha'] == sha and payload['encoding'] == 'base64'
              raw = base64.b64decode(''.join(payload['content'].split()), validate=True)
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              chunks.append(raw)
          data = b''.join(chunks)
          assert hashlib.sha256(data).hexdigest() == '953dd236ca79d860690cfe21f329abb6e3f9d0ae7d14cf3fc21b5f1c472485ec'
          seen = set()
          for row in json.loads(lzma.decompress(data, memlimit=256*1024*1024)):
              name = row['path']; path = Path(name)
              assert name not in seen and not path.is_absolute() and '..' not in path.parts
              assert name == 'AGENTS.md' or name.startswith('nexus/')
              assert not path.is_symlink()
              seen.add(name)
              if row['source']:
                  assert git('hash-object', name) == row['source'], name
                  old = path.read_text(encoding='utf-8')
              else:
                  assert not path.exists(), name
                  old = ''
              result = []
              for part in row['parts']:
                  if isinstance(part, str): result.append(part)
                  else:
                      start, end = part
                      assert 0 <= start <= end <= len(old)
                      result.append(old[start:end])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(''.join(result), encoding='utf-8')
              assert git('hash-object', name) == row['target'], name
          subprocess.check_call(['git', 'add', '--', 'AGENTS.md', 'nexus'])
          tree = git('write-tree')
          assert git('rev-parse', tree + ':nexus') == 'b8a2d786c91fbb41bb4c4066575b5ac41f45e611'
          assert git('rev-parse', tree + ':AGENTS.md') == 'fcda9ab4a76f8b5f7d91b74563b739098e655f8b'
          subprocess.check_call(['git', 'diff', '--cached', '--check'])
          subprocess.check_call(['git', 'diff', '--cached', '--exit-code', '--', '.github'])
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Build exact product graph and verify runtime regression tests
        run: |
          bun install --cwd nexus --frozen-lockfile
          bun run build
          bun run typecheck
          bun run --cwd nexus/apps/extension-spectra test:unit
          bun run --cwd nexus/apps/extension-halo test:unit
          git diff --exit-code
      - name: Commit code checkpoint within Actions contents permission
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/nexus-business-preserving-integration
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 664d0615f850c568a8840ac312ca7c92cb81ceee
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --exit-code -- .github
          git config user.name 'NEXUS integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(spectra): own popup observation by ports and make browser evidence reproducible'
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'REPAIR_COMMIT=%s\nPRODUCT_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD:nexus)"
          printf 'Code is retained. Normal workflow fixes and temporary-workflow removal require the authorized connector; main is unchanged.\n' >> "$GITHUB_STEP_SUMMARY"
