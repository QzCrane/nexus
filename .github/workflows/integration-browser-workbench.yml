name: Integration repair checkpoint
on:
  push:
    branches: [codex/nexus-business-preserving-integration]
    paths: ['.github/workflows/integration-browser-workbench.yml']
permissions:
  contents: write
concurrency:
  group: nexus-integration-repair-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'QzCrane/nexus' && github.ref == 'refs/heads/codex/nexus-business-preserving-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Reconstruct checksum-bound source repairs
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, re, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args]).decode().strip()
          transport = '27fe0371bbe059d5e44367a68f8cbd185b0a9e76'
          assert git('rev-parse', 'HEAD^') == transport
          previous = git('show', transport + ':.github/workflows/integration-browser-workbench.yml')
          data = base64.b64decode(re.search(r"RECIPE: '([^']+)'", previous).group(1), validate=True)
          assert hashlib.sha256(data).hexdigest() == '04294ce59f78c3c53144542e5df60fa6d463fe62aecbfabfa6c08296bc95cfd6'
          seen = set()
          for row in json.loads(lzma.decompress(data, memlimit=256*1024*1024)):
              name = row['path']; path = Path(name)
              assert name not in seen and not path.is_absolute() and '..' not in path.parts
              assert name == 'AGENTS.md' or name.startswith('nexus/')
              seen.add(name)
              if row['source']:
                  assert git('hash-object', name) == row['source'], name
                  old = path.read_text()
              else:
                  assert not path.exists(), name
                  old = ''
              result = []
              for part in row['parts']:
                  if isinstance(part, str): result.append(part)
                  else:
                      start, end = part
                      assert 0 <= start <= end <= len(old)
                      result.append(old[start:end])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(''.join(result))
              assert git('hash-object', name) == row['target'], name
          subprocess.check_call(['git', 'add', '--', 'AGENTS.md', 'nexus'])
          tree = git('write-tree')
          assert git('rev-parse', tree + ':nexus') == '6242894343ac51d472f20bfcdfca07decd032a53'
          assert git('rev-parse', tree + ':AGENTS.md') == 'fcda9ab4a76f8b5f7d91b74563b739098e655f8b'
          subprocess.check_call(['git', 'diff', '--cached', '--check'])
          subprocess.check_call(['git', 'diff', '--cached', '--exit-code', '--', '.github'])
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Build required contract artifacts and verify repairs
        run: |
          bun install --cwd nexus --frozen-lockfile
          bun run build
          bun run typecheck
          bun run --cwd nexus check:toolchain
          bun run --cwd nexus/apps/extension-spectra test:unit
          bun test nexus/apps/extension-halo/test/theme-contrast.spec.ts nexus/scripts/diagnostics-contract.spec.ts
          git diff --exit-code
      - name: Commit verified code without changing workflows or main
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/nexus-business-preserving-integration
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 664d0615f850c568a8840ac312ca7c92cb81ceee
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --exit-code -- .github
          git config user.name 'NEXUS integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(integration): restore physical feedback, popup sizing, diagnostics and quality contracts'
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'REPAIR_COMMIT=%s\nPRODUCT_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD:nexus)"
