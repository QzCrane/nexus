name: Integration browser workbench
on:
  push:
    branches:
      - codex/nexus-business-preserving-integration
    paths:
      - '.github/workflows/integration-browser-workbench.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Resolve a separate exact minimum-browser protocol driver
        shell: bash
        run: |
          set -euo pipefail
          bun install --cwd nexus --frozen-lockfile
          bun add --cwd nexus/apps/extension-spectra --dev --exact 'puppeteer-floor@npm:puppeteer-core@24.7.2'
          bun install --cwd nexus --frozen-lockfile
          out="$RUNNER_TEMP/nexus-floor-lock"
          mkdir -p "$out"
          cp nexus/apps/extension-spectra/package.json "$out/spectra-package.json"
          cp nexus/bun.lock "$out/bun.lock"
          git diff -- nexus/bun.lock nexus/apps/extension-spectra/package.json > "$out/driver.patch"
          find nexus -type d -name node_modules -print0 -prune > "$RUNNER_TEMP/dependency-paths.z"
          tar -czf "$out/dependencies.tar.gz" --null -T "$RUNNER_TEMP/dependency-paths.z"
          (cd "$out" && sha256sum spectra-package.json bun.lock dependencies.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-floor-lock
          path: ${{ runner.temp }}/nexus-floor-lock/
          retention-days: 1
          if-no-files-found: error
