name: Integration browser workbench
on:
  push:
    branches:
      - codex/nexus-business-preserving-integration
    paths:
      - '.github/workflows/integration-browser-workbench.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Capture committed source without credentials or dependencies
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nexus-candidate-source"
          mkdir -p "$out"
          git update-ref refs/audit/candidate HEAD
          git update-ref refs/audit/main 664d0615f850c568a8840ac312ca7c92cb81ceee
          git update-ref refs/audit/architecture 7d4bf273130d73dbf63348affc3a258fcdac4627
          git update-ref refs/audit/total 4b14658c107f33778bc5d48505609cafd58a0aec
          git bundle create "$out/candidate.bundle" refs/audit/candidate refs/audit/main refs/audit/architecture refs/audit/total
          git bundle verify "$out/candidate.bundle"
          (cd "$out" && sha256sum candidate.bundle > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-candidate-source
          path: ${{ runner.temp }}/nexus-candidate-source/
          retention-days: 1
          if-no-files-found: error
