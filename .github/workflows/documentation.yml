name: Documentation architecture

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/documentation.yml"
      - "lefthook.yml"
      - "package.json"
      - "nexus/package.json"
      - "nexus/scripts/lint-docs.ts"
      - "nexus/scripts/check-toolchain.ts"
      - "nexus/scripts/check-platform-contract.ts"
      - "nexus/scripts/platform-contract.ts"
      - "nexus/scripts/platform-contract.test.ts"
      - "nexus/scripts/sync-public.ts"
  push:
    branches:
      - "**"
    paths:
      - "**/*.md"
      - ".github/workflows/documentation.yml"
      - "lefthook.yml"
      - "package.json"
      - "nexus/package.json"
      - "nexus/scripts/lint-docs.ts"
      - "nexus/scripts/check-toolchain.ts"
      - "nexus/scripts/check-platform-contract.ts"
      - "nexus/scripts/platform-contract.ts"
      - "nexus/scripts/platform-contract.test.ts"
      - "nexus/scripts/sync-public.ts"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile

      - name: Check documentation architecture
        run: bun run docs:check

      - name: Check pinned toolchain
        run: bun --cwd nexus check:toolchain

      - name: Check cross-platform contract
        run: bun run check:platform

      - name: Check documentation tooling lint
        run: >-
          bun --cwd nexus scripts/run-strict-biome.ts
          scripts/lint-docs.ts
          scripts/check-platform-contract.ts
          scripts/platform-contract.ts
          scripts/platform-contract.test.ts
          scripts/check-toolchain.ts
          scripts/sync-public.ts

      - name: Test AI-tool hooks
        run: bun --cwd nexus scripts/hooks/test.ts

      - name: Verify repository architecture
        run: bun run verify:q
