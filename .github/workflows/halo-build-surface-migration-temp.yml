name: TEMP HALO startup accounting migration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/halo-frame-scope-performance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/halo-frame-scope-performance
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Patch build accounting fail-closed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nexus/apps/extension-halo/build.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """\treaddirSync,
\trmSync,
\tstatSync,
\twriteFileSync,
""",
                  """\treaddirSync,
\treadFileSync,
\trmSync,
\tstatSync,
\twriteFileSync,
""",
              ),
              (
                  """import { execFileSync } from 'node:child_process';
""",
                  """import { execFileSync } from 'node:child_process';
import { measureContentStartupSurfaces } from './build-runtime-surfaces';
""",
              ),
              (
                  """\tconst visited = new Set();
\tconst stack = [start];
\tlet bytes = 0;
""",
                  """\tconst visited = new Set();
\tconst outputBytes = new Map();
\tconst stack = [start];
\tlet bytes = 0;
""",
              ),
              (
                  """\t\tvisited.add(current);
\t\tbytes += detail.bytes;
""",
                  """\t\tvisited.add(current);
\t\toutputBytes.set(current, detail.bytes);
\t\tbytes += detail.bytes;
""",
              ),
              (
                  """\treturn { bytes, files: visited.size };
""",
                  """\treturn { bytes, fileCount: visited.size, outputBytes };
""",
              ),
              (
                  """\t\t\t\t// SidePanel metafile is always retained in memory because startup
\t\t\t\t// closure is a production performance invariant. Other domains emit
\t\t\t\t// full analysis only on explicit --analyze builds.
\t\t\t\tmetafile: entry.kind === 'sidepanel' || isAnalyze,
""",
                  """\t\t\t\t// Every production entry retains an in-memory metafile because startup
\t\t\t\t// accounting follows the complete static closure declared by manifest
\t\t\t\t// frame/lifecycle scope. Dev builds keep the SidePanel closure for its
\t\t\t\t// physical lazy-loading invariant; --analyze retains all domains.
\t\t\t\tmetafile: !isDev || entry.kind === 'sidepanel' || isAnalyze,
""",
              ),
              (
                  """\tconst byOutput = new Map(buildResults.map((item) => [item.entry.out, item]));
\tconst sizeOf = (output) => byOutput.get(output)?.bytes ?? 0;
\tconst allFrameDocumentStart = sizeOf('content-smooth-scroll.js') + sizeOf('content-frame-tools.js');
\tconst topFrameDocumentStart = allFrameDocumentStart + sizeOf('content.js');
\tconst allFrameDocumentIdle = sizeOf('content-clipboard.js');
\tconst topFrameDocumentIdle = allFrameDocumentIdle + sizeOf('content-hover-zoom.js');

\tconst sidepanelResult = byOutput.get('sidepanel.js');
""",
                  """\tconst byOutput = new Map(buildResults.map((item) => [item.entry.out, item]));
\tconst resultFor = (output) => {
\t\tconst result = byOutput.get(output);
\t\tif (!result) throw new Error(`HALO manifest/build output is missing: ${output}`);
\t\treturn result;
\t};
\tconst sizeOf = (output) => resultFor(output).bytes;
\tconst closureFor = (output) => {
\t\tconst result = resultFor(output);
\t\tconst closure = staticOutputClosure(result.result.metafile, output);
\t\tif (!closure) {
\t\t\tthrow new Error(`HALO static startup closure could not be resolved for manifest output ${output}`);
\t\t}
\t\treturn closure;
\t};
\tconst sourceManifest = JSON.parse(
\t\treadFileSync(path.join(__dirname, 'public/manifest.json'), 'utf8'),
\t);
\tconst {
\t\tallFrameDocumentStart,
\t\ttopFrameDocumentStart,
\t\tallFrameDocumentIdle,
\t\ttopFrameDocumentIdle,
\t} = measureContentStartupSurfaces(sourceManifest, closureFor);

\tconst sidepanelResult = resultFor('sidepanel.js');
""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'build.ts migration anchor count={count}: {old[:90]!r}')
              text = text.replace(old, new)

          files_count = text.count('sidepanelStartup.files')
          if files_count != 2:
              raise SystemExit(f'sidepanelStartup.files count={files_count}')
          text = text.replace('sidepanelStartup.files', 'sidepanelStartup.fileCount')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile
      - name: Focused startup accounting tests
        run: bun --cwd nexus/apps/extension-halo test test/build-runtime-surfaces.spec.ts test/release-tooling.spec.ts
      - name: Typecheck HALO
        run: bun --cwd nexus typecheck:halo
      - name: Build HALO dependencies
        run: bun --cwd nexus build:halo-deps
      - name: Build HALO production candidate
        run: bun --cwd nexus/apps/extension-halo build:prod
      - name: Commit build migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nexus/apps/extension-halo/build.ts
          git diff --cached --check
          git commit -m "perf(halo): account startup surfaces from manifest"
          git push origin HEAD:agent/halo-frame-scope-performance
