name: TEMP HALO keyboard tail patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/halo-scroll-event-ownership-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/halo-scroll-event-ownership-v2
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Replace premature microtask cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('nexus/apps/extension-halo/src/content/smooth-scroll-keyboard.ts')
          text = source.read_text(encoding='utf-8')
          old = """\tdocument.addEventListener('keydown', finalizeAtDocument);
          \twindow.addEventListener('keydown', finalizeAtWindow);
          \tqueueMicrotask(() => {
          \t\tif (!finalized) cleanup();
          \t});
          """
          new = """\tdocument.addEventListener('keydown', finalizeAtDocument);
          \twindow.addEventListener('keydown', finalizeAtWindow);
          \tsetTimeout(() => {
          \t\tif (!finalized) cleanup();
          \t}, 0);
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'tail-cleanup anchor count={count}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          contract = Path('nexus/apps/extension-halo/test/smooth-scroll-keyboard-contract.spec.ts')
          text = contract.read_text(encoding='utf-8')
          old = """\t\texpect(keyboardSource).toContain('candidate.cancelBubble');
          \t\texpect(keyboardSource).toMatch(/e\\.defaultPrevented \\|\\|\\s*e\\.cancelBubble \\|\\|/u);
          """
          new = """\t\texpect(keyboardSource).toContain('candidate.cancelBubble');
          \t\texpect(keyboardSource).toMatch(/e\\.defaultPrevented \\|\\|\\s*e\\.cancelBubble \\|\\|/u);
          \t\texpect(keyboardSource).toMatch(/setTimeout\\(\\(\\) => \\{\\s*if \\(!finalized\\) cleanup\\(\\);\\s*\\}, 0\\);/u);
          \t\texpect(keyboardSource).not.toMatch(/queueMicrotask\\(\\(\\) => \\{\\s*if \\(!finalized\\) cleanup\\(\\);/u);
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'contract anchor count={count}')
          contract.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile
      - name: Focused smooth-scroll tests
        run: bun --cwd nexus/apps/extension-halo test:smooth-scroll
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nexus/apps/extension-halo/src/content/smooth-scroll-keyboard.ts nexus/apps/extension-halo/test/smooth-scroll-keyboard-contract.spec.ts
          git commit -m "fix(halo): keep keyboard tails through event propagation"
          git push origin HEAD:agent/halo-scroll-event-ownership-v2
