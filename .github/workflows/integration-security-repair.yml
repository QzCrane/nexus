name: Integration dependency security repair
on:
  push:
    branches: [codex/nexus-business-preserving-integration]
    paths: ['.github/workflows/integration-security-repair.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: nexus-integration-security-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'QzCrane/nexus' && github.ref == 'refs/heads/codex/nexus-business-preserving-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Restore exact Bun-generated locks and rebind reviewed observations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c378b4939c4770bcc681b7d155067d3bdf3a74a0
          gh api repos/QzCrane/nexus/actions/artifacts/9988203068/zip > "$RUNNER_TEMP/verified-locks.zip"
          printf '%s  %s\n' 952e5d8eb67ba82eed9e3531394a86c5471f09e9af5c99c012ab4bd0daaa8b9d "$RUNNER_TEMP/verified-locks.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          files=[
            ('repository.bun.lock','bun.lock','040142cc36250aa842779b0d73fc0efaf5a8cfbc','77c5530d4bef8cc766d74caa13a472d394de8444'),
            ('product.bun.lock','nexus/bun.lock','70c07451cce415e381c48ffa4f876e9fc0f13665','04d1f21253328417ef903dfb34595fcec1fb829e'),
            ('product.package.json','nexus/package.json','c34c497d7ab1b8059379db93cb54cfd8dff430f7','22bef77594f086a4750d726d34ae4ba2fc95d6eb'),
          ]
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'],'verified-locks.zip')) as archive:
            for source,target,before,after in files:
              assert git('hash-object',target)==before
              data=archive.read(source)
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==after
              Path(target).write_bytes(data)
          path=Path('nexus/dependency-revalidation.json')
          assert git('hash-object',str(path))=='52a5aaa820c78876a39f5cde26fdf127e61f12f3'
          policy=json.loads(path.read_text())
          policy['lockObservedAt']='2026-09-06'
          policy['lockSha256']=hashlib.sha256(Path('nexus/bun.lock').read_bytes()).hexdigest()
          path.write_text(json.dumps(policy,ensure_ascii=False,indent=2)+'\n')
          assert git('hash-object',str(path))=='64ced6b27de0341d588450f29a502bcd558462fb'
          subprocess.check_call(['git','diff','--check'])
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Revalidate generated locks, actual advisories and unchanged reviewed versions
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nexus-security-evidence"
          mkdir -p "$out"
          bun install --frozen-lockfile --ignore-scripts
          bun install --cwd nexus --frozen-lockfile
          bun audit --json | tee "$out/repository-audit.json"
          (cd nexus && bun audit --json) | tee "$out/product-audit.json"
          bun --cwd nexus audit:dependencies
          printf 'fix(deps): retain secure transitive resolvers\n' | bun node_modules/@commitlint/cli/cli.js --strict
          if printf 'invalid commit message\n' | bun node_modules/@commitlint/cli/cli.js --strict; then exit 1; fi
          bun run build
          bun run typecheck
          bun run --cwd nexus check:governance
          bun run --cwd nexus lint:repository-surfaces
          cp bun.lock "$out/repository.bun.lock"
          cp nexus/bun.lock "$out/product.bun.lock"
          cp nexus/package.json "$out/product.package.json"
          cp nexus/dependency-revalidation.json "$out/dependency-revalidation.json"
          git diff -- bun.lock nexus/bun.lock nexus/package.json nexus/dependency-revalidation.json > "$out/security-lock.patch"
      - name: Commit verified security repairs without changing main or workflow files
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/nexus-business-preserving-integration
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 664d0615f850c568a8840ac312ca7c92cb81ceee
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          test "$(git diff --name-only)" = "$(printf 'bun.lock\nnexus/bun.lock\nnexus/dependency-revalidation.json\nnexus/package.json')"
          git diff --check
          git add -- bun.lock nexus/bun.lock nexus/package.json nexus/dependency-revalidation.json
          git diff --cached --exit-code -- .github
          git config user.name 'NEXUS integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): remove vulnerable parsers and extractor while retaining floor driver'
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$RUNNER_TEMP/nexus-security-evidence/head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/nexus-security-evidence/tree.txt"
          (cd "$RUNNER_TEMP/nexus-security-evidence" && sha256sum repository.bun.lock product.bun.lock repository-audit.json product-audit.json > SHA256SUMS.txt)
      - name: Preserve exact resolution and actual audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-security-repair
          path: ${{ runner.temp }}/nexus-security-evidence/
          if-no-files-found: ignore
          retention-days: 7
