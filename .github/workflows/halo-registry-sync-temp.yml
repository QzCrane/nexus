name: TEMP HALO registry sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/halo-scroll-event-ownership-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/halo-scroll-event-ownership-v2
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        run: bun install --cwd nexus --frozen-lockfile
      - name: Generate canonical registry twice
        shell: bash
        run: |
          set -euo pipefail
          outputs=(
            nexus/apps/extension-halo/src/kernel/registry/_generated.ts
            nexus/apps/extension-halo/src/kernel/registry/_generated-background-active.ts
            nexus/apps/extension-halo/src/components/_generated-tool-loader.ts
            nexus/apps/extension-halo/src/i18n/locales/_generated-tools-en.ts
            nexus/apps/extension-halo/src/i18n/locales/_generated-tools-zh.ts
            nexus/apps/extension-halo/public/script-plugin-runtime.json
          )
          bun nexus/scripts/generate-tool-registry.ts
          sha256sum "${outputs[@]}" > /tmp/registry-first.sha256
          bun nexus/scripts/generate-tool-registry.ts
          sha256sum "${outputs[@]}" > /tmp/registry-second.sha256
          diff -u /tmp/registry-first.sha256 /tmp/registry-second.sha256
      - name: Verify provenance and deterministic discovery
        run: bun --cwd nexus/apps/extension-halo test test/resource-provenance.spec.ts test/registry-generation.spec.ts
      - name: Typecheck HALO
        run: bun --cwd nexus typecheck:halo
      - name: Commit tracked generator output
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            nexus/apps/extension-halo/src/kernel/registry/_generated.ts \
            nexus/apps/extension-halo/src/kernel/registry/_generated-background-active.ts \
            nexus/apps/extension-halo/src/components/_generated-tool-loader.ts \
            nexus/apps/extension-halo/src/i18n/locales/_generated-tools-en.ts \
            nexus/apps/extension-halo/src/i18n/locales/_generated-tools-zh.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Tracked generator output already canonical.'
            exit 0
          fi
          git commit -m "chore(halo): sync keyboard provenance registry"
          git push origin HEAD:agent/halo-scroll-event-ownership-v2
