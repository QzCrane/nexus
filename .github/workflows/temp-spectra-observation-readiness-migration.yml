name: TEMP SPECTRA observation readiness migration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'fix/spectra-smoke-lifecycle-barriers' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spectra-smoke-lifecycle-barriers
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --cwd nexus --frozen-lockfile
      - name: Add authoritative observation-readiness status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} exact anchors, got {count}: {old!r}')
              p.write_text(text.replace(old, new, expected))

          protocol = 'nexus/packages/contracts/src/spectra.protocol.ts'
          replace_exact(protocol,
              "\truntimeRevision: string | null;\n\tready: boolean;\n\townedSources: ContentRuntimeSourceOwnership[];",
              "\truntimeRevision: string | null;\n\tobservationsReady: boolean;\n\tready: boolean;\n\townedSources: ContentRuntimeSourceOwnership[];")
          replace_exact(protocol,
              "const CONTENT_RUNTIME_STATUS_KEYS = new Set(['bootstrapRevision', 'runtimeRevision', 'ready', 'ownedSources']);",
              "const CONTENT_RUNTIME_STATUS_KEYS = new Set([\n\t'bootstrapRevision', 'runtimeRevision', 'observationsReady', 'ready', 'ownedSources',\n]);")
          replace_exact(protocol,
              "\t\t&& (value.runtimeRevision === null || isRuntimeRevision(value.runtimeRevision))\n\t\t&& typeof value.ready === 'boolean'",
              "\t\t&& (value.runtimeRevision === null || isRuntimeRevision(value.runtimeRevision))\n\t\t&& typeof value.observationsReady === 'boolean'\n\t\t&& typeof value.ready === 'boolean'")

          bootstrap = 'nexus/apps/extension-spectra/src/content/core/bootstrap.ts'
          replace_exact(bootstrap,
              "\t\t\t\truntimeRevision: state.runtimeRevision,\n\t\t\t\tready: state.ready,",
              "\t\t\t\truntimeRevision: state.runtimeRevision,\n\t\t\t\tobservationsReady,\n\t\t\t\tready: state.ready,")

          smoke = 'nexus/apps/extension-spectra/test/smoke.spec.ts'
          replace_exact(smoke,
              "\truntimeRevision: string | null;\n\tready: boolean;\n\townedSources:",
              "\truntimeRevision: string | null;\n\tobservationsReady: boolean;\n\tready: boolean;\n\townedSources:")
          replace_exact(smoke,
              "async function getRuntimeLeaseClient(): Promise<Page> {",
              "async function waitForContentObservationReadiness(\n\turl = fixturePage.url(),\n\ttimeoutMs = 15_000,\n): Promise<ContentBootstrapStatus> {\n\treturn eventually(\n\t\t() => readContentBootstrapStatus(url),\n\t\t(status) => status.observationsReady === true,\n\t\t`content observation readiness for ${url}`,\n\t\ttimeoutMs,\n\t);\n}\n\nasync function getRuntimeLeaseClient(): Promise<Page> {")
          replace_exact(smoke,
              "\t\t\tawait waitForContentBootstrapStatus(recommendationUrl);\n\t\t\tconst tabId = await getTabId(recommendationUrl);\n\t\t\tawait page.evaluate(() => {",
              "\t\t\tawait waitForContentBootstrapStatus(recommendationUrl);\n\t\t\tawait waitForContentObservationReadiness(recommendationUrl);\n\t\t\tconst tabId = await getTabId(recommendationUrl);\n\t\t\tawait page.evaluate(() => {")
          PY
      - name: Verify repository build
        run: bun --cwd nexus build
      - name: Verify focused readiness and protocol contracts
        working-directory: nexus/apps/extension-spectra
        run: bun test test/smoke-lifecycle-contract.spec.ts test/spectra-protocol.spec.ts test/content-runtime-readiness.spec.ts
      - name: Build SPECTRA development smoke candidate
        run: bun --cwd nexus/apps/extension-spectra build:dev
      - name: Repeat recommendation smoke
        working-directory: nexus/apps/extension-spectra
        run: |
          for attempt in 1 2 3; do
            echo "recommendation smoke attempt ${attempt}/3"
            bun test test/smoke.spec.ts --test-name-pattern 'drops a muted recommendation preview but preserves explicit intent for a same-origin detail'
          done
      - name: Commit verified readiness contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus/packages/contracts/src/spectra.protocol.ts nexus/apps/extension-spectra/src/content/core/bootstrap.ts nexus/apps/extension-spectra/test/smoke.spec.ts
          git diff --cached --check
          git commit -m 'test(spectra): wait for bootstrap observation readiness'
          git push origin HEAD:fix/spectra-smoke-lifecycle-barriers
