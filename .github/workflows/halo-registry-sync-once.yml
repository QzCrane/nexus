name: HALO registry sync once

on:
  push:
    branches:
      - agent/halo-hover-zoom-on-demand-v2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/halo-hover-zoom-on-demand-v2
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen workspace
        run: bun install --cwd nexus --frozen-lockfile
      - name: Generate and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          files=(
            nexus/apps/extension-halo/src/kernel/registry/_generated.ts
            nexus/apps/extension-halo/src/kernel/registry/_generated-background-active.ts
            nexus/apps/extension-halo/src/components/_generated-tool-loader.ts
            nexus/apps/extension-halo/src/i18n/locales/_generated-tools-en.ts
            nexus/apps/extension-halo/src/i18n/locales/_generated-tools-zh.ts
          )
          bun nexus/scripts/generate-tool-registry.ts
          sha256sum "${files[@]}" > /tmp/registry-first.sha256
          bun nexus/scripts/generate-tool-registry.ts
          sha256sum "${files[@]}" > /tmp/registry-second.sha256
          diff -u /tmp/registry-first.sha256 /tmp/registry-second.sha256

          allowed='^(nexus/apps/extension-halo/src/kernel/registry/_generated\.ts|nexus/apps/extension-halo/src/kernel/registry/_generated-background-active\.ts|nexus/apps/extension-halo/src/components/_generated-tool-loader\.ts|nexus/apps/extension-halo/src/i18n/locales/_generated-tools-en\.ts|nexus/apps/extension-halo/src/i18n/locales/_generated-tools-zh\.ts)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected generated diff:\n%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Verify generated provenance
        run: bun --cwd nexus/apps/extension-halo test test/resource-provenance.spec.ts test/registry-generation.spec.ts
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            nexus/apps/extension-halo/src/kernel/registry/_generated.ts
            nexus/apps/extension-halo/src/kernel/registry/_generated-background-active.ts
            nexus/apps/extension-halo/src/components/_generated-tool-loader.ts
            nexus/apps/extension-halo/src/i18n/locales/_generated-tools-en.ts
            nexus/apps/extension-halo/src/i18n/locales/_generated-tools-zh.ts
          )
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(halo): sync generated hover provenance'
          git push origin HEAD:agent/halo-hover-zoom-on-demand-v2
