name: Minimum Chrome compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/minimum-chrome.yml'
      - 'nexus/browser-floor.json'
      - 'nexus/apps/extension-spectra/**'
      - 'nexus/apps/extension-halo/**'
      - 'nexus/packages/**'
      - 'nexus/scripts/**'
      - 'nexus/package.json'
      - 'nexus/bun.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/minimum-chrome.yml'
      - 'nexus/browser-floor.json'
      - 'nexus/apps/extension-spectra/**'
      - 'nexus/apps/extension-halo/**'
      - 'nexus/packages/**'
      - 'nexus/scripts/**'
      - 'nexus/package.json'
      - 'nexus/bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimum-chrome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome-floor:
    name: Minimum Chrome product floor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install frozen workspace
        run: bun install --cwd nexus --frozen-lockfile

      - name: Verify governance before browser work
        run: bun --cwd nexus check:governance

      - name: Build exact production candidates
        run: bun run build

      - name: Install browser system dependencies
        working-directory: nexus/apps/extension-halo
        run: bunx playwright install-deps chromium

      - name: Resolve canonical Chrome floor
        shell: bash
        run: bun nexus/scripts/browser-floor.ts github-env >> "$GITHUB_ENV"

      - name: Download and verify canonical Chrome floor
        shell: bash
        run: |
          set -euo pipefail
          chrome_root="$RUNNER_TEMP/chrome-floor"
          archive="$RUNNER_TEMP/chrome-linux64.zip"
          mkdir -p "$chrome_root"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$archive" \
            "$CHROME_FLOOR_URL"
          printf '%s  %s\n' "$CHROME_FLOOR_SHA256" "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$chrome_root"
          executable="$chrome_root/$CHROME_FLOOR_EXECUTABLE"
          test -x "$executable"
          version_output="$($executable --version)"
          printf 'Pinned browser: %s\n' "$version_output"
          case "$version_output" in
            *"${CHROME_FLOOR_VERSION}"*) ;;
            *) echo "Expected Chrome ${CHROME_FLOOR_VERSION}, got ${version_output}" >&2; exit 1 ;;
          esac
          echo "NEXUS_CHROME_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Prove SPECTRA real Action Popup multi-tab behavior on Chrome floor
        working-directory: nexus/apps/extension-spectra
        run: bun test test/tab-visibility-chrome.spec.ts

      - name: Prove SPECTRA extension-page accessibility on Chrome floor
        working-directory: nexus/apps/extension-spectra
        run: bun test test/accessibility-chrome.spec.ts

      - name: Prove SPECTRA local diagnostic source and port lifecycle on Chrome floor
        working-directory: nexus/apps/extension-spectra
        run: bun test test/diagnostics-chrome.spec.ts

      - name: Prove HALO admitted SidePanel and page capabilities on Chrome floor
        working-directory: nexus/apps/extension-halo
        run: bunx playwright test test/minimum-chrome-playwright.spec.ts --workers=1

      - name: Capture review visuals or enforce certified exact baselines on Chrome floor
        run: bun run --cwd nexus test:visual

      - name: Publish visual review candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: visual-candidates-${{ github.sha }}
          path: artifacts/visual-candidates/*.png
          if-no-files-found: ignore
          retention-days: 14
