name: TEMP HALO Preact lock materialization

on:
  push:
    branches:
      - experiment/halo-preact-sidepanel
    paths:
      - '.github/workflows/temp-halo-preact-lock.yml'
      - 'nexus/apps/extension-halo/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/halo-preact-sidepanel
          fetch-depth: 0

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Materialize deterministic text lock
        run: bun install --cwd nexus --lockfile-only

      - name: Commit lock only when changed
        shell: bash
        run: |
          if git diff --quiet -- nexus/bun.lock; then
            echo 'bun.lock already matches package authority'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus/bun.lock
          git commit -m 'chore(halo): lock preact experiment'
          git push origin HEAD:experiment/halo-preact-sidepanel
