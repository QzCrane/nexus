name: Materialize verified integration
on:
  push:
    branches:
      - codex/nexus-business-preserving-integration
    paths:
      - '.github/workflows/integration-source-snapshot.yml'
permissions:
  contents: write
concurrency:
  group: materialize-nexus-business-integration
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'QzCrane/nexus' && github.ref == 'refs/heads/codex/nexus-business-preserving-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read frozen transport head and histories
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify candidate source and preserve workflows outside Actions write scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, subprocess, tempfile
          from pathlib import Path
          source = ''.join(Path(f'.integration-replay/part-{i}.txt').read_text().strip() for i in range(1, 5))
          recipe = Path(os.environ['RUNNER_TEMP'], 'nexus-integration-recipe.xz')
          recipe.write_bytes(base64.b64decode(source, validate=True))
          tree = subprocess.check_output(['python3', '.integration-replay/apply.py', str(recipe)], text=True).strip()
          assert tree == 'cc81a3cbb01f5ee989a4474ac9d09023e723a291'
          fd, index = tempfile.mkstemp(); os.close(fd); os.unlink(index)
          env = dict(os.environ, GIT_INDEX_FILE=index)
          def git(*args): return subprocess.check_output(['git', *args], env=env)
          try:
              git('read-tree', tree)
              for path in git('ls-tree', '-rz', '--name-only', tree, '--', '.github/workflows').split(b'\0'):
                  if path: git('update-index', '--force-remove', '--', path.decode())
              for row in git('ls-tree', '-rz', 'HEAD', '--', '.github/workflows').split(b'\0'):
                  if not row: continue
                  meta, path = row.split(b'\t', 1)
                  mode, kind, sha = meta.decode().split()
                  assert kind == 'blob'
                  git('update-index', '--add', '--cacheinfo', f'{mode},{sha},{path.decode()}')
              code_tree = git('write-tree').decode().strip()
              with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('CODE_TREE=' + code_tree + '\n')
          finally:
              if Path(index).exists(): Path(index).unlink()
          PY
      - name: Fast-forward integration code only
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/nexus-business-preserving-integration
          main=664d0615f850c568a8840ac312ca7c92cb81ceee
          head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$main"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$head"
          git diff --exit-code "$head" "$CODE_TREE" -- .github/workflows
          git diff --check "$main" "$CODE_TREE"
          git config user.name 'NEXUS integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(printf '%s\n\n%s\n' 'feat(integration): preserve business and reconcile closure implementations' 'Verified candidate source; workflow-only reconciliation remains for the authorized connector. Main promotion is blocked until full browser validation.' | git commit-tree "$CODE_TREE" -p "$head")"
          git push origin "$commit:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$commit"
          printf 'Integrated code commit: `%s`\n\nIntermediate tree: `%s`\n\nCanonical complete candidate tree: `cc81a3cbb01f5ee989a4474ac9d09023e723a291`\n\nWorkflow changes are deliberately left unchanged for authorized connector publication.\n' "$commit" "$CODE_TREE" >> "$GITHUB_STEP_SUMMARY"
          echo "Integrated code commit: $commit"
          echo "Intermediate tree: $CODE_TREE"
