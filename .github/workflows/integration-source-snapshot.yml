name: Integration source snapshot
on:
  push:
    branches:
      - codex/nexus-business-preserving-integration
    paths:
      - '.github/workflows/integration-source-snapshot.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download exact Chrome floor
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nexus-chrome-floor"
          mkdir -p "$out"
          curl --fail --location --retry 3 --output "$out/chrome-linux64.zip" https://storage.googleapis.com/chrome-for-testing-public/135.0.7049.114/linux64/chrome-linux64.zip
          printf '%s  %s\n' dd86dbace037a9b6c4bc993fc4e20ee768a804923850511e53255743760d8b82 "$out/chrome-linux64.zip" | sha256sum --check --strict
      - name: Retain exact browser for local integration verification
        uses: actions/upload-artifact@v4
        with:
          name: nexus-chrome-floor
          path: ${{ runner.temp }}/nexus-chrome-floor/chrome-linux64.zip
          retention-days: 1
          if-no-files-found: error
