name: Apply documentation consumer migration

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-documentation-migration.yml"
      - "nexus/scripts/migrate-documentation-consumers.mjs"

permissions:
  contents: write

concurrency:
  group: apply-documentation-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/review-optimize-all-markdown'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          repository: QzCrane/nexus
          ref: agent/review-optimize-all-markdown
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply exact replacements
        run: bun nexus/scripts/migrate-documentation-consumers.mjs

      - name: Commit migrated consumers
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nexus/apps/extension-spectra/test/control-contracts.spec.ts \
            nexus/scripts/verify/check-spectra-control.js \
            nexus/scripts/hooks/test.mjs
          git commit -m "chore(docs): migrate executable documentation consumers"
          git push origin HEAD:agent/review-optimize-all-markdown
