name: Export documentation consumer migration

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-documentation-migration.yml"
      - "nexus/scripts/migrate-documentation-consumers.mjs"

permissions:
  contents: read

concurrency:
  group: export-documentation-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/review-optimize-all-markdown'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/review-optimize-all-markdown
          fetch-depth: 1

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply exact replacements
        run: bun nexus/scripts/migrate-documentation-consumers.mjs

      - name: Verify migration diff
        run: |
          git diff --check
          git diff --exit-code --quiet && {
            echo "Expected migration changes were not produced"
            exit 1
          }

      - name: Upload migrated consumers
        uses: actions/upload-artifact@v4
        with:
          name: migrated-documentation-consumers
          retention-days: 1
          if-no-files-found: error
          path: |
            nexus/apps/extension-spectra/test/control-contracts.spec.ts
            nexus/scripts/verify/check-spectra-control.js
            nexus/scripts/hooks/test.mjs
