name: HALO keyboard test migration

on:
  push:
    branches:
      - agent/halo-scroll-event-ownership

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[halo-test-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/halo-scroll-event-ownership
          fetch-depth: 0

      - name: Replace obsolete keyboard tests
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('nexus/apps/extension-halo/test/smooth-scroll.spec.ts')
          text = path.read_text(encoding='utf-8')

          declaration = "let onKeydown: typeof import('../src/content/smooth-scroll-handlers').onKeydown;\n"
          replacement_declaration = (
              "let captureKeyboardState: typeof import('../src/content/smooth-scroll-handlers').captureKeyboardState;\n"
              + declaration
          )
          if declaration not in text:
              raise SystemExit('onKeydown declaration seam not found')
          text = text.replace(declaration, replacement_declaration, 1)

          import_pattern = re.compile(
              r"\(\{ onMouseDown, onMouseMove, onWheel, onKeydown, resetInputHandlers \} =\n"
              r"\t\tawait import\('\.\./src/content/smooth-scroll-handlers'\)\);"
          )
          import_replacement = (
              "({ captureKeyboardState, onMouseDown, onMouseMove, onWheel, onKeydown, resetInputHandlers } =\n"
              "\t\tawait import('../src/content/smooth-scroll-handlers'));"
          )
          text, import_count = import_pattern.subn(import_replacement, text, count=1)
          if import_count != 1:
              raise SystemExit(f'handler import seam count was {import_count}')

          start_marker = "describe('smooth scroll keyboard', () => {"
          end_marker = "describe('sidepanel smooth scroll', () => {"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('keyboard describe seams not found')

          keyboard_tests = r'''describe('smooth scroll keyboard', () => {
	function keyEvent(key: string, extras: Partial<{
		shiftKey: boolean;
		ctrlKey: boolean;
		altKey: boolean;
		metaKey: boolean;
		repeat: boolean;
	}> = {}): KeyboardEvent {
		const event = {
			key,
			isTrusted: true,
			defaultPrevented: false,
			propagationStopped: false,
			shiftKey: false,
			ctrlKey: false,
			altKey: false,
			metaKey: false,
			repeat: false,
			...extras,
			preventDefault() { (this as { defaultPrevented: boolean }).defaultPrevented = true; },
			stopPropagation() { (this as { propagationStopped: boolean }).propagationStopped = true; },
		};
		return event as unknown as KeyboardEvent;
	}

	interface FakeMediaState {
		isConnected: boolean;
		muted: boolean;
		paused: boolean;
		playbackRate: number;
		volume: number;
	}

	function mediaState(): FakeMediaState {
		return {
			isConnected: true,
			muted: false,
			paused: false,
			playbackRate: 1,
			volume: 1,
		};
	}

	function withMedia(media: FakeMediaState, fn: () => void): void {
		const doc = document as unknown as {
			querySelectorAll: (selector: string) => unknown[];
		};
		const original = doc.querySelectorAll;
		doc.querySelectorAll = (selector: string) =>
			selector === 'video, audio' ? [media] : original(selector);
		try {
			fn();
		} finally {
			doc.querySelectorAll = original;
		}
	}

	test('spacebar scrolls page smoothly when the site leaves it unclaimed', () => {
		root.styleState.overflowY = 'auto';
		body.styleState.overflowY = 'hidden';
		const event = keyEvent(' ');
		const start = performance.now();

		onKeydown(event);

		expect(event.defaultPrevented).toBe(true);
		expect((event as unknown as { propagationStopped: boolean }).propagationStopped).toBe(false);
		expect(frameCallbacks.size).toBe(1);
		runUntilIdle(start + 16);
		expect(fakeWindow.scrollY).toBeCloseTo(window.innerHeight * 0.9, 5);
	});

	test('yields when a site handler already prevented the shortcut', () => {
		root.styleState.overflowY = 'auto';
		body.styleState.overflowY = 'hidden';
		const event = keyEvent('ArrowDown');
		event.preventDefault();

		onKeydown(event);

		expect(frameCallbacks.size).toBe(0);
		expect((event as unknown as { propagationStopped: boolean }).propagationStopped).toBe(false);
	});

	test('does not infer keyboard ownership from media presence or dimensions', () => {
		root.styleState.overflowY = 'auto';
		body.styleState.overflowY = 'hidden';
		const media = mediaState();
		const event = keyEvent('ArrowDown');

		withMedia(media, () => {
			const capture = captureKeyboardState(event);
			onKeydown(event, capture);
		});

		expect(event.defaultPrevented).toBe(true);
		expect(frameCallbacks.size).toBe(1);
		runUntilIdle(performance.now() + 16);
		expect(fakeWindow.scrollY).toBeCloseTo(DEFAULT_SETTINGS.arrowKeyStep, 5);
	});

	test('yields after a site synchronously changes media state without preventDefault', () => {
		root.styleState.overflowY = 'auto';
		body.styleState.overflowY = 'hidden';
		const media = mediaState();
		const event = keyEvent('ArrowDown');

		withMedia(media, () => {
			const capture = captureKeyboardState(event);
			media.volume = 0.9;
			onKeydown(event, capture);
		});

		expect(event.defaultPrevented).toBe(true);
		expect(frameCallbacks.size).toBe(0);
		expect(fakeWindow.scrollY).toBe(0);
	});

	test('PageUp and PageDown remain page-scroll commands', () => {
		root.styleState.overflowY = 'auto';
		body.styleState.overflowY = 'hidden';
		const event = keyEvent('PageDown');

		onKeydown(event);

		expect(event.defaultPrevented).toBe(true);
		expect(frameCallbacks.size).toBe(1);
		runUntilIdle(performance.now() + 16);
		expect(fakeWindow.scrollY).toBeCloseTo(window.innerHeight * 0.9, 5);
	});

	test('normalizes high-frequency arrow repeat instead of admitting every OS event', () => {
		root.styleState.overflowY = 'auto';
		body.styleState.overflowY = 'hidden';
		root.scrollHeight = 20_000;

		fakeNow = 1_000;
		onKeydown(keyEvent('ArrowDown'));
		for (const timestamp of [1_020, 1_040, 1_060, 1_080]) {
			fakeNow = timestamp;
			const repeat = keyEvent('ArrowDown', { repeat: true });
			onKeydown(repeat);
			expect(repeat.defaultPrevented).toBe(true);
		}
		runUntilIdleAtInterval(fakeNow, 16, 500);

		expect(fakeWindow.scrollY).toBeCloseTo(
			2 * DEFAULT_SETTINGS.arrowKeyStep,
			5,
		);
	});

	test('does not clear an active PageDown animation on an accepted repeat', () => {
		root.styleState.overflowY = 'auto';
		body.styleState.overflowY = 'hidden';
		root.scrollHeight = 20_000;
		const page = window.innerHeight * 0.9;

		fakeNow = 1_000;
		onKeydown(keyEvent('PageDown'));
		fakeNow = 1_180;
		onKeydown(keyEvent('PageDown', { repeat: true }));
		fakeNow = 1_240;
		onKeydown(keyEvent('PageDown', { repeat: true }));
		runUntilIdleAtInterval(fakeNow, 16, 500);

		expect(fakeWindow.scrollY).toBeCloseTo(2 * page, 5);
	});

	test('does not preventDefault when no animatable target exists', () => {
		root.styleState.overflowY = 'hidden';
		body.styleState.overflowY = 'hidden';
		root.scrollHeight = 100;
		const event = keyEvent(' ');

		onKeydown(event);

		expect(event.defaultPrevented).toBe(false);
		expect((event as unknown as { propagationStopped: boolean }).propagationStopped).toBe(false);
	});
});

'''

          text = text[:start] + keyboard_tests + text[end:]
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/halo-keyboard-test-migration.yml')
          workflow.unlink()

      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/apps/extension-halo/test/smooth-scroll.spec.ts .github/workflows/halo-keyboard-test-migration.yml
          git commit -m "test(halo): replace obsolete keyboard expectations [halo-test-migration]"
          git push origin HEAD:agent/halo-scroll-event-ownership
