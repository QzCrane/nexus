name: TEMP SPECTRA feedback-window migration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'fix/spectra-smoke-lifecycle-barriers' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spectra-smoke-lifecycle-barriers
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --cwd nexus --frozen-lockfile
      - name: Replace one-phase feedback wait with a complete visible-to-hidden window
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('nexus/apps/extension-spectra/test/smoke.spec.ts')
          text = path.read_text()
          old = """\t\t\tconst waitForHotkeyFeedbackWindow = () => page.waitForFunction(() => {\n\t\t\t\tconst osd = document.querySelector<HTMLElement>('#spectra-osd-host')\n\t\t\t\t\t?.shadowRoot?.getElementById('o');\n\t\t\t\treturn osd !== null && osd !== undefined && !osd.classList.contains('v');\n\t\t\t}, { timeout: 3_500 });"""
          new = """\t\t\tconst waitForHotkeyFeedbackWindow = async () => {\n\t\t\t\tawait page.waitForFunction(() => {\n\t\t\t\t\tconst osd = document.querySelector<HTMLElement>('#spectra-osd-host')\n\t\t\t\t\t\t?.shadowRoot?.getElementById('o');\n\t\t\t\t\treturn osd?.classList.contains('v') === true;\n\t\t\t\t}, { timeout: 3_500 });\n\t\t\t\tawait page.waitForFunction(() => {\n\t\t\t\t\tconst osd = document.querySelector<HTMLElement>('#spectra-osd-host')\n\t\t\t\t\t\t?.shadowRoot?.getElementById('o');\n\t\t\t\t\treturn osd !== null && osd !== undefined && !osd.classList.contains('v');\n\t\t\t\t}, { timeout: 3_500 });\n\t\t\t};"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'feedback-window migration anchor count must be 1, got {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify lifecycle contracts
        working-directory: nexus/apps/extension-spectra
        run: bun test test/smoke-lifecycle-contract.spec.ts
      - name: Build workspace production candidates
        run: bun --cwd nexus build
      - name: Build SPECTRA development smoke candidate
        run: bun --cwd nexus/apps/extension-spectra build:dev
      - name: Repeat configured-site hotkey smoke
        working-directory: nexus/apps/extension-spectra
        run: |
          for attempt in 1 2 3; do
            echo "configured-hotkey smoke attempt ${attempt}/3"
            bun test test/smoke.spec.ts --test-name-pattern 'arbitrates configured site hotkeys website-first and releases a truncated keyup'
          done
      - name: Commit verified barrier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus/apps/extension-spectra/test/smoke.spec.ts
          git diff --cached --check
          git commit -m 'test(spectra): wait through complete hotkey feedback windows'
          git push origin HEAD:fix/spectra-smoke-lifecycle-barriers
