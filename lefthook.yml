# Lefthook — NEXUS local quality gates
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    documentation-architecture:
      glob: "**/*.md"
      run: bun run docs:check
      skip:
        - merge
        - rebase
    biome-check:
      glob: "**/*.{ts,tsx,js,jsx,mjs,cjs,json}"
      root: "nexus/"
      run: bun scripts/run-strict-biome.mjs {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    repository-lint:
      run: bun run lint
    platform-contract:
      run: bun run check:platform
    toolchain:
      run: bun --cwd nexus check:toolchain
    documentation-architecture:
      run: bun run docs:check
    hooks-smoke:
      run: bun --cwd nexus scripts/hooks/test.mjs
    verify-architecture:
      run: bun run verify:q
    typecheck:
      run: bun --cwd nexus typecheck
    ai-pitfalls:
      run: bun --cwd nexus lint:ai-pitfalls
    sync-skills:
      run: bun run sync:skills -- --check

post-merge:
  commands:
    sync-skills:
      run: bun run sync:skills
