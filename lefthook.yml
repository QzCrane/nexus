# Lefthook — NEXUS local quality gates
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    documentation-architecture:
      glob: "**/*.md"
      run: bun run docs:check
      skip:
        - merge
        - rebase
    biome-check:
      glob: "**/*.{ts,tsx,js,jsx,mjs,cjs,json}"
      root: "nexus/"
      run: bunx @biomejs/biome check --no-errors-on-unmatched --max-diagnostics=50 {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    platform-contract:
      run: bun run check:platform
    toolchain:
      run: bun --cwd nexus check:toolchain
    documentation-architecture:
      run: bun run docs:check
    hooks-smoke:
      run: bun --cwd nexus scripts/hooks/test.mjs
    verify-architecture:
      run: bun run verify:q
    typecheck:
      run: bun --cwd nexus typecheck:spectra
    ai-pitfalls:
      run: bun --cwd nexus lint:ai-pitfalls
    sync-skills:
      run: bun run sync:skills -- --check

post-merge:
  commands:
    sync-skills:
      run: bun run sync:skills
