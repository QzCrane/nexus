<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="view-container">

    <div id="view-main" class="view active">
      <div class="nav-island">
        <div class="brand">Volume Master <span class="ver">2026</span></div>
        <div class="nav-right">
          <button id="btn-settings" class="btn-icon" title="Settings">⚙️</button>
          <button id="btn-shortcuts" class="btn-icon" title="Shortcuts">⌨️</button>
        </div>
      </div>

      <div id="main-stage"></div>

      <div id="empty-state" class="empty-container">
        <div class="empty-blob"></div>
        <div class="empty-text" data-i18n="noAudio">No Audio Signal</div>
      </div>

      <div class="stack-header hidden" id="bg-header">
        <span data-i18n="bgTitle">Background</span>
        <span id="bg-badge" class="badge">0</span>
      </div>
      <div id="bg-stack" class="bg-stack"></div>
    </div>

    <div id="view-settings" class="view">
      <div class="nav-island">
        <button id="btn-back" class="btn-icon">←</button>
        <div class="brand" data-i18n="settingsTitle">Settings</div>
        <div class="nav-placeholder"></div>
      </div>

      <div class="settings-list">
        <div class="setting-item">
          <div class="setting-label">
            <div data-i18n="osdLabel">OSD Popup</div>
            <div class="setting-sub" data-i18n="osdSub">Show overlay when changing volume</div>
          </div>
          <label class="switch-main">
            <input type="checkbox" id="set-osd">
            <span class="slider-round"></span>
          </label>
        </div>

        <div class="setting-item">
          <div class="setting-label" data-i18n="langLabel">Language</div>
          <select id="set-lang" class="setting-select">
            <option value="en-US">English</option>
            <option value="zh-CN">简体中文</option>
          </select>
        </div>

        <div class="version-info">Ver 23.0 • Ultra Build</div>
      </div>
    </div>

  </div>

  <template id="tmpl-card">
    <div class="glass-card">
      <div class="card-top">
        <div class="meta-group">
          <img class="meta-icon" src="">
          <div class="meta-text">
            <div class="meta-title" title=""></div>
            <div class="meta-domain"></div>
          </div>
        </div>
        <div class="top-right">
          <div class="save-actions">
            <button class="btn-text btn-reset" title="Reset">↺</button>
            <button class="btn-text btn-save" title="Save">💾</button>
          </div>
          <label class="switch-main"><input type="checkbox" class="sw-enable"><span class="slider-round"></span></label>
        </div>
      </div>

      <div class="sleep-mask hidden">
        <div class="sleep-content">
          <div class="sleep-icon">⏻</div>
          <div class="sleep-text"></div>
        </div>
      </div>

      <div class="viz-island"><canvas class="viz-canvas" width="360" height="40"></canvas>
        <div class="viz-baseline"></div>
      </div>

      <div class="control-stack">
        <div class="slider-row">
          <button class="btn-mute">🔊</button>
          <div class="slider-rail-container">
            <input type="range" class="vol-slider" min="0" max="800" step="10" value="100">
            <div class="slider-fill"></div>
            <div class="slider-bg"></div>
          </div>
          <div class="vol-number">100%</div>
        </div>
        <div class="chips-row">
          <label class="chip"><input type="checkbox" class="sw-comp"><span class="chip-body"
              data-i18n="comp">Compressor</span></label>
          <label class="chip"><input type="checkbox" class="sw-bass"><span class="chip-body"
              data-i18n="bass">Bass</span></label>
          <label class="chip"><input type="checkbox" class="sw-mono"><span class="chip-body"
              data-i18n="mono">Mono</span></label>
        </div>
      </div>

      <div class="eq-island">
        <div class="eq-trigger"><span data-i18n="eqTitle">🎚️ 10-Band EQ</span>
          <div class="eq-arrow">▼</div>
        </div>
        <div class="eq-drawer collapsed">
          <div class="eq-container">
            <canvas class="eq-curve-canvas" width="340" height="120"></canvas>
            <div class="eq-sliders-row">
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="0" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">32</span>
              </div>
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="1" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">64</span>
              </div>
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="2" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">125</span>
              </div>
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="3" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">250</span>
              </div>
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="4" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">500</span>
              </div>
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="5" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">1k</span>
              </div>
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="6" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">2k</span>
              </div>
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="7" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">4k</span>
              </div>
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="8" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">8k</span>
              </div>
              <div class="eq-col"><span class="eq-val-display">0</span>
                <div class="eq-track-line"></div>
                <div class="eq-zero-dot"></div><input type="range" data-i="9" min="-12" max="12" step="0.1"
                  value="0"><span class="eq-hz">16k</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>

</html>
