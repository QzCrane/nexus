<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPECTRA Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* 深色主题 (默认) */
    :root {
      --bg: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      --bg-solid: #0f0f1a;
      --card: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --accent: #667eea;
      --accent2: #764ba2;
      --success: #4caf50;
      --danger: #f44336;
      --text: #fff;
      --text-dim: rgba(255, 255, 255, 0.6);
    }
    /* 浅色主题 */
    :root.light {
      --bg: linear-gradient(145deg, #f5f7fa 0%, #e4e8ef 50%, #dfe5ed 100%);
      --bg-solid: #f5f7fa;
      --card: rgba(0, 0, 0, 0.04);
      --card-hover: rgba(0, 0, 0, 0.08);
      --accent: #5a67d8;
      --accent2: #6b46c1;
      --success: #38a169;
      --danger: #e53e3e;
      --text: #1a202c;
      --text-dim: rgba(26, 32, 44, 0.6);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* 垂直居中 */
      color: var(--text);
      padding: 16px;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    /* 已连接后顶部对齐 */
    body.connected {
      justify-content: flex-start;
    }

    /* 头部 */
    .header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .status-dot.connected { background: var(--success); }

    /* 连接界面 */
    .connect-view {
      width: 100%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .connect-view input {
      width: 100%;
      padding: 14px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 18px;
      text-align: center;
      letter-spacing: 6px;
      text-transform: uppercase;
      -webkit-appearance: none;
      appearance: none;
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }
    .connect-view input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .connect-view button {
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    /* 连接按钮 loading 状态 */
    .connect-view button.loading {
      opacity: 0.7;
      pointer-events: none;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.4; }
    }
    .error-msg {
      color: var(--danger);
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    /* 遥控器界面 */
    .remote-view {
      display: none;
      width: 100%;
      max-width: 320px;
      flex-direction: column;
      gap: 16px;
    }
    .remote-view.active { display: flex; }

    /* 音量显示 */
    .volume-display {
      text-align: center;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
    }
    .volume-value {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .volume-label { font-size: 12px; color: var(--text-dim); }

    /* 控制区块 */
    .control-section {
      background: var(--card);
      border-radius: 16px;
      padding: 12px;
    }
    .section-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    /* 按钮网格 */
    .btn-grid {
      display: grid;
      gap: 8px;
    }
    .btn-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .btn-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .btn-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
    .btn-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

    /* 按钮样式 */
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      background: var(--card-hover);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 60px;
    }
    .btn:active {
      transform: scale(0.95);
      background: rgba(102, 126, 234, 0.3);
    }
    .btn-label {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* 主播放按钮 */
    .btn-play {
      font-size: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      min-height: 70px;
    }

    /* 静音按钮 */
    .btn.muted { background: var(--danger); }

    /* 速度显示 */
    .speed-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    /* 标签页信息 */
    .tab-info {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
    }
    .tab-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-domain {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* 主题切换按钮 */
    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: var(--card-hover);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      z-index: 100;
      transition: transform 0.2s;
    }
    .theme-toggle:active { transform: scale(0.9); }

    /* 连接码徽章 */
    .session-badge {
      background: var(--accent);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 12px;
    }

    /* 会话列表栏 */
    .sessions-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
      margin-bottom: 8px;
    }
    .session-tab {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      transition: 0.2s;
    }
    .session-tab.active {
      border-color: var(--accent);
      color: var(--text);
      background: var(--card-hover);
    }
    .session-tab.disconnected {
      opacity: 0.5;
    }
    .session-tab .close-btn {
      font-size: 10px;
      opacity: 0.6;
      margin-left: 2px;
    }
    .btn-add-session {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 2px dashed var(--text-dim);
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-add-session:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 主题切换 -->
  <button class="theme-toggle" id="btn-theme">🌙</button>

  <div class="header">
    <h1>📱 SPECTRA Remote</h1>
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">未连接</span>
    </div>
  </div>

  <!-- 连接界面 -->
  <div class="connect-view" id="connect-view">
    <input type="text" id="session-input" placeholder="会话码" maxlength="6" autocomplete="off" inputmode="text" autocapitalize="characters">
    <button id="btn-connect">连接</button>
    <p class="error-msg" id="error-msg"></p>
  </div>

  <!-- 遥控器界面 -->
  <div class="remote-view" id="remote-view">
    <!-- 会话列表 -->
    <div class="sessions-bar" id="sessions-bar">
      <!-- 动态生成的会话标签 -->
    </div>
    <button class="btn-add-session" id="btn-add-session">➕ 添加连接</button>

    <!-- 当前会话信息 -->
    <div class="tab-info" id="tab-info">
      <div class="tab-title" id="tab-title">等待同步...</div>
      <div class="tab-domain" id="tab-domain">-</div>
    </div>

    <!-- 当前连接码 -->
    <div class="session-badge" id="session-badge"></div>

    <!-- 音量 -->
    <div class="volume-display">
      <div class="volume-value" id="vol-display">100%</div>
      <div class="volume-label">音量</div>
    </div>

    <!-- 音量控制 -->
    <div class="control-section">
      <div class="btn-grid cols-4">
        <button class="btn" id="btn-vol-down">➖<span class="btn-label">-10</span></button>
        <button class="btn" id="btn-vol-up">➕<span class="btn-label">+10</span></button>
        <button class="btn" id="btn-vol-100">1️⃣<span class="btn-label">100%</span></button>
        <button class="btn" id="btn-mute">🔇<span class="btn-label">静音</span></button>
      </div>
    </div>

    <!-- 播放 + 进度控制 (合并) -->
    <div class="control-section">
      <div class="btn-grid cols-5">
        <button class="btn" id="btn-seek-back-30">⏮<span class="btn-label">-30s</span></button>
        <button class="btn" id="btn-seek-back">⏪<span class="btn-label">-10s</span></button>
        <button class="btn btn-play" id="btn-play-pause">⏸</button>
        <button class="btn" id="btn-seek-forward">⏩<span class="btn-label">+10s</span></button>
        <button class="btn" id="btn-seek-forward-30">⏭<span class="btn-label">+30s</span></button>
      </div>
    </div>

    <!-- 速度控制 -->
    <div class="control-section">
      <div class="section-title">播放速度 <span class="speed-value" id="speed-display">1.00x</span></div>
      <div class="btn-grid cols-3">
        <button class="btn" id="btn-speed-down">🐢<span class="btn-label">-0.25</span></button>
        <button class="btn" id="btn-speed-reset">🔄<span class="btn-label">重置</span></button>
        <button class="btn" id="btn-speed-up">🐇<span class="btn-label">+0.25</span></button>
      </div>
    </div>

    <!-- 视频控制已移除（全屏/PiP需要用户手势，无法远程触发） -->
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const sessionInput = $('session-input');
    const connectView = $('connect-view');
    const remoteView = $('remote-view');
    const statusDot = $('status-dot');
    const statusText = $('status-text');
    const errorMsg = $('error-msg');
    const sessionsBar = $('sessions-bar');

    // ========== 多会话管理器 ==========
    const sessions = new Map(); // sid -> { peer, conn, state, connected }
    let activeSessionId = null; // 当前激活的会话ID
    const STORAGE_KEY = 'spectra_sessions';

    // 从 localStorage 恢复会话列表
    function loadSavedSessions() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return saved.filter(s => s && s.length >= 4);
      } catch { return []; }
    }

    // 保存会话列表到 localStorage
    function saveSessions() {
      const sids = Array.from(sessions.keys());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sids));
    }

    // 从URL获取会话码
    const urlSession = new URLSearchParams(location.search).get('s');

    // 初始化：恢复保存的会话 或 从 URL 连接
    function init() {
      const saved = loadSavedSessions();
      if (urlSession) {
        createSession(urlSession.toUpperCase());
      } else if (saved.length > 0) {
        saved.forEach(sid => createSession(sid));
      }
    }

    $('btn-connect').onclick = () => {
      const sid = sessionInput.value.trim().toUpperCase();
      if (!sid || sid.length < 4) return showError('请输入会话码');
      if (sessions.has(sid)) return showError('此会话已存在');
      createSession(sid);
      sessionInput.value = '';
    };
    sessionInput.onkeydown = e => e.key === 'Enter' && $('btn-connect').click();

    // 添加新会话按钮
    $('btn-add-session').onclick = () => {
      remoteView.classList.remove('active');
      connectView.classList.remove('hidden');
      document.body.classList.remove('connected');
    };

    // 创建新会话连接
    function createSession(sid) {
      if (sessions.has(sid)) return;
      
      const session = { peer: null, conn: null, state: {}, connected: false };
      sessions.set(sid, session);
      saveSessions();
      renderSessionTabs();
      
      showError('');
      statusText.textContent = `连接 ${sid}...`;
      
      session.peer = new Peer();
      session.peer.on('open', () => {
        session.conn = session.peer.connect(`spectra-${sid}`);
        session.conn.on('open', () => {
          session.connected = true;
          switchSession(sid);
          renderSessionTabs();
          showRemoteView();
        });
        session.conn.on('data', data => {
          if (data.type === 'state') {
            session.state = { ...session.state, ...data };
            if (activeSessionId === sid) updateUI(data);
          }
        });
        session.conn.on('close', () => handleDisconnect(sid));
        session.conn.on('error', e => handleDisconnect(sid, e.message));
      });
      session.peer.on('error', e => {
        const msg = e.type === 'peer-unavailable' ? '会话不存在' : e.message;
        showError(`${sid}: ${msg}`);
        removeSession(sid);
      });
      setTimeout(() => {
        if (sessions.has(sid) && !sessions.get(sid).connected) {
          showError(`${sid}: 连接超时`);
          removeSession(sid);
        }
      }, 10000);
    }

    // 处理会话断开
    function handleDisconnect(sid, errMsg) {
      const s = sessions.get(sid);
      if (s) {
        s.connected = false;
        renderSessionTabs();
        if (activeSessionId === sid) statusText.textContent = errMsg ? `错误: ${errMsg}` : '已断开';
      }
    }

    // 移除会话
    function removeSession(sid) {
      const s = sessions.get(sid);
      if (s) {
        s.conn?.close();
        s.peer?.destroy();
      }
      sessions.delete(sid);
      saveSessions();
      renderSessionTabs();
      // 如果删除的是当前激活的，切换到其他
      if (activeSessionId === sid) {
        activeSessionId = null;
        const next = sessions.keys().next().value;
        if (next) switchSession(next);
        else hideRemoteView();
      }
    }

    // 切换激活会话
    function switchSession(sid) {
      if (!sessions.has(sid)) return;
      activeSessionId = sid;
      const s = sessions.get(sid);
      statusDot.classList.toggle('connected', s.connected);
      statusText.textContent = s.connected ? '已连接' : '未连接';
      $('session-badge').textContent = '🔗 ' + sid;
      updateUI(s.state);
      renderSessionTabs();
    }

    // 发送命令到当前会话
    function sendCmd(cmd) {
      if (!activeSessionId) return;
      const s = sessions.get(activeSessionId);
      if (s?.conn?.open) s.conn.send({ type: 'command', command: cmd });
    }

    function updateUI(s) {
      if (s.volume !== undefined) $('vol-display').textContent = s.volume + '%';
      if (s.muted !== undefined) $('btn-mute').classList.toggle('muted', s.muted);
      if (s.playing !== undefined) $('btn-play-pause').textContent = s.playing ? '⏸' : '▶️';
      if (s.speed !== undefined) $('speed-display').textContent = s.speed.toFixed(2) + 'x';
      if (s.tabTitle !== undefined) $('tab-title').textContent = s.tabTitle || '未知';
      if (s.tabDomain !== undefined) $('tab-domain').textContent = s.tabDomain || '-';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
    }

    // 渲染会话标签栏
    function renderSessionTabs() {
      sessionsBar.innerHTML = '';
      sessions.forEach((s, sid) => {
        const tab = document.createElement('div');
        tab.className = 'session-tab' + (sid === activeSessionId ? ' active' : '') + (!s.connected ? ' disconnected' : '');
        tab.innerHTML = `${sid} <span class="close-btn">✕</span>`;
        tab.onclick = (e) => {
          if (e.target.classList.contains('close-btn')) {
            removeSession(sid);
          } else {
            switchSession(sid);
          }
        };
        sessionsBar.appendChild(tab);
      });
    }

    // 显示遥控器视图
    function showRemoteView() {
      connectView.classList.add('hidden');
      remoteView.classList.add('active');
      document.body.classList.add('connected');
    }

    // 隐藏遥控器视图
    function hideRemoteView() {
      remoteView.classList.remove('active');
      connectView.classList.remove('hidden');
      document.body.classList.remove('connected');
      statusDot.classList.remove('connected');
      statusText.textContent = '未连接';
    }

    // 初始化
    init();

    // 主题切换
    const btnTheme = $('btn-theme');
    let isDark = true;
    // 从 localStorage 恢复
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light');
      btnTheme.textContent = '☀️';
      isDark = false;
    }
    btnTheme.onclick = () => {
      isDark = !isDark;
      document.documentElement.classList.toggle('light', !isDark);
      btnTheme.textContent = isDark ? '🌙' : '☀️';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    };

    // 按钮事件
    $('btn-vol-down').onclick = () => sendCmd('volume_down');
    $('btn-vol-up').onclick = () => sendCmd('volume_up');
    $('btn-vol-100').onclick = () => sendCmd('volume_100');
    $('btn-mute').onclick = () => sendCmd('mute');
    $('btn-play-pause').onclick = () => sendCmd('play_pause');
    $('btn-seek-back').onclick = () => sendCmd('seek_backward');
    $('btn-seek-forward').onclick = () => sendCmd('seek_forward');
    $('btn-seek-back-30').onclick = () => sendCmd('seek_backward_30');
    $('btn-seek-forward-30').onclick = () => sendCmd('seek_forward_30');
    $('btn-speed-down').onclick = () => sendCmd('speed_down');
    $('btn-speed-up').onclick = () => sendCmd('speed_up');
    $('btn-speed-reset').onclick = () => sendCmd('speed_reset');
    // 全屏/PiP 已移除 (浏览器安全策略需要用户手势)
  </script>
</body>
</html>
