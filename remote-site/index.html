<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPECTRA Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* 深色主题 (默认) */
    :root {
      --bg: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      --bg-solid: #0f0f1a;
      --card: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --accent: #667eea;
      --accent2: #764ba2;
      --success: #4caf50;
      --danger: #f44336;
      --text: #fff;
      --text-dim: rgba(255, 255, 255, 0.6);
    }
    /* 浅色主题 */
    :root.light {
      --bg: linear-gradient(145deg, #f5f7fa 0%, #e4e8ef 50%, #dfe5ed 100%);
      --bg-solid: #f5f7fa;
      --card: rgba(0, 0, 0, 0.04);
      --card-hover: rgba(0, 0, 0, 0.08);
      --accent: #5a67d8;
      --accent2: #6b46c1;
      --success: #38a169;
      --danger: #e53e3e;
      --text: #1a202c;
      --text-dim: rgba(26, 32, 44, 0.6);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* 垂直居中 */
      color: var(--text);
      padding: 16px;
      padding-bottom: env(safe-area-inset-bottom, 16px);
      overflow-x: hidden;
    }

    /* 已连接后顶部对齐 */
    body.connected {
      justify-content: flex-start;
    }

    /* 头部 */
    .header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .status-dot.connected { background: var(--success); }

    /* 集成式入口卡片样式 - 与面板融为一体 */
    .portal-section {
      width: 100%;
      background: var(--card);
      padding: 30px 20px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.4s ease-out;
    }
    .portal-section h2 { font-size: 19px; text-align: center; margin: 0; }
    .portal-section p { font-size: 13px; color: var(--text-dim); text-align: center; margin: 0; }
    
    .portal-input-group { position: relative; width: 100%; }
    .portal-input-group input {
      width: 100%;
      padding: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(0,0,0,0.2);
      color: var(--accent);
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 4px;
      text-transform: uppercase;
      box-sizing: border-box;
    }
    .portal-input-group input:focus { outline: none; border-color: var(--accent); }

    /* 全屏弹窗样式 - 仅用于添加连接 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    
    /* 正在连接状态样式 */
    .loading-view { text-align: center; padding: 20px 0; }
    .loading-view .icon { font-size: 40px; margin-bottom: 16px; animation: pulse 1.5s infinite; display: block; }
    .loading-view .text { color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .loading-view .sid { font-size: 12px; color: var(--text-dim); font-family: monospace; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .error-msg { color: var(--danger); font-size: 12px; text-align: center; min-height: 18px; }
    .hidden { display: none !important; }

    /* 遥控器界面 - 作为底座常驻 */
    .remote-view {
      display: flex; /* 始终开启 */
      width: 100%;
      max-width: 320px;
      flex-direction: column;
      gap: 16px;
      padding-top: 60px;
      box-sizing: border-box;
    }

    /* 音量显示 */
    .volume-display {
      text-align: center;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
    }
    .volume-value {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .volume-label { font-size: 12px; color: var(--text-dim); }

    /* 控制区块 */
    .control-section {
      background: var(--card);
      border-radius: 16px;
      padding: 12px;
    }
    .section-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    /* 按钮网格 */
    .btn-grid {
      display: grid;
      gap: 8px;
    }
    .btn-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .btn-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .btn-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
    .btn-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

    /* 按钮样式 */
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      background: var(--card-hover);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 60px;
    }
    .btn:active {
      transform: scale(0.95);
      background: rgba(102, 126, 234, 0.3);
    }
    .btn-label {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* 主播放按钮 */
    .btn-play {
      font-size: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      min-height: 70px;
    }

    /* 静音按钮 */
    .btn.muted { background: var(--danger); }

    /* 速度显示 */
    .speed-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    /* 标签页信息 */
    .tab-info {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
    }
    .tab-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-domain {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* 主题切换按钮 */
    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: var(--card-hover);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      z-index: 100;
      transition: transform 0.2s;
    }
    .theme-toggle:active { transform: scale(0.9); }

    /* 连接码徽章 */
    .session-badge {
      background: var(--accent);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 12px;
    }

    /* 会话列表栏 */
    .sessions-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
      margin-bottom: 8px;
    }
    .session-tab {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      transition: 0.2s;
    }
    .session-tab.active {
      border-color: var(--accent);
      color: var(--text);
      background: var(--card-hover);
    }
    .session-tab.disconnected {
      opacity: 0.5;
    }
    .session-tab .close-btn {
      font-size: 10px;
      opacity: 0.6;
      margin-left: 2px;
    }
    .btn-add-session {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border: 2px dashed var(--text-dim);
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .btn-add-session:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 主题切换 -->
  <button class="theme-toggle" id="btn-theme">🌙</button>

  <div class="header">
    <h1>📱 SPECTRA Remote</h1>
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">未连接</span>
    </div>
  </div>

  <!-- ➕ 新添加连接专用弹窗 (仅在已进入后使用) -->
  <div class="modal-overlay" id="modal-portal">
    <div class="portal-section" style="max-width: 320px;">
      <div style="text-align: right; margin-bottom: -30px; position: relative; z-index: 10;">
        <span id="close-modal" style="cursor: pointer; padding: 10px; opacity: 0.6;">✕</span>
      </div>
      <h2>🔗 添加新连接</h2>
      <p>输入插件端显示的 6 位校验码</p>
      <div class="portal-input-group">
        <input type="text" id="modal-session-input" placeholder="000000" maxlength="6" autocomplete="off" inputmode="text" autocapitalize="characters">
      </div>
      <button class="btn-action btn-primary" id="btn-modal-connect">立即连接</button>
      <p class="error-msg" id="modal-error-msg"></p>
    </div>
  </div>

  <!-- 遥控器界面 -->
  <div class="remote-view" id="remote-view">
    <!-- 会话列表 -->
    <div class="sessions-bar" id="sessions-bar">
      <!-- 动态生成的会话标签 -->

    </div>

    <div id="main-content">
      <!-- 集成式入口区域：输入、加载或提示 -->
      <div id="portal-area">
        <!-- 初始进入时的连接表单 -->
        <div class="portal-section" id="initial-portal">
          <h2>🔗 连接 SPECTRA</h2>
          <p>输入插件端显示的 6 位校验码</p>
          <div class="portal-input-group">
            <input type="text" id="session-input" placeholder="000000" maxlength="6" autocomplete="off" inputmode="text" autocapitalize="characters">
          </div>
          <button class="btn-action btn-primary" id="btn-connect">立即连接</button>
          <p class="error-msg" id="error-msg"></p>
        </div>

        <!-- 初始连接时的正在连接视图 -->
        <div class="loading-view hidden" id="initial-loading">
          <span class="icon">📡</span>
          <div class="text">正在建立连接...</div>
          <div class="sid" id="initial-loading-target">TARGET: -</div>
        </div>
      </div>

      <!-- 实际遥控控制组件 (已进入状态) -->
      <div id="control-area" class="hidden">
        <!-- 音量显示 -->
        <div class="volume-display">
          <div class="vol-label">Volume</div>
          <div class="vol-value" id="vol-display">0%</div>
        </div>
    <!-- 当前会话信息 -->
    <div class="tab-info" id="tab-info">
      <div class="tab-title" id="tab-title">等待同步...</div>
      <div class="tab-domain" id="tab-domain">-</div>
    </div>

    <!-- 当前连接码已移除 -->

    <!-- 音量 -->
    <div class="volume-display">
      <div class="volume-value" id="vol-display">100%</div>
      <div class="volume-label">音量</div>
    </div>

    <!-- 音量控制 -->
    <div class="control-section">
      <div class="btn-grid cols-4">
        <button class="btn" id="btn-vol-down">➖<span class="btn-label">-10</span></button>
        <button class="btn" id="btn-vol-up">➕<span class="btn-label">+10</span></button>
        <button class="btn" id="btn-vol-100">1️⃣<span class="btn-label">100%</span></button>
        <button class="btn" id="btn-mute">🔇<span class="btn-label">静音</span></button>
      </div>
    </div>

    <!-- 播放 + 进度控制 (合并) -->
    <div class="control-section">
      <div class="btn-grid cols-5">
        <button class="btn" id="btn-seek-back-30">⏮<span class="btn-label">-30s</span></button>
        <button class="btn" id="btn-seek-back">⏪<span class="btn-label">-10s</span></button>
        <button class="btn btn-play" id="btn-play-pause">⏸</button>
        <button class="btn" id="btn-seek-forward">⏩<span class="btn-label">+10s</span></button>
        <button class="btn" id="btn-seek-forward-30">⏭<span class="btn-label">+30s</span></button>
      </div>
    </div>

    <!-- 速度控制 -->
    <div class="control-section">
      <div class="section-title">播放速度 <span class="speed-value" id="speed-display">1.00x</span></div>
      <div class="btn-grid cols-3">
        <button class="btn" id="btn-speed-down">🐢<span class="btn-label">-0.25</span></button>
        <button class="btn" id="btn-speed-reset">🔄<span class="btn-label">重置</span></button>
        <button class="btn" id="btn-speed-up">🐇<span class="btn-label">+0.25</span></button>
      </div>
    </div>

    <!-- 视频控制已移除（全屏/PiP需要用户手势，无法远程触发） -->
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const sessionInput = $('session-input');
    const modalInput = $('modal-session-input');
    const portalArea = $('portal-area');
    const initialPortal = $('initial-portal');
    const initialLoading = $('initial-loading');
    const controlArea = $('control-area');
    const modalPortal = $('modal-portal');
    
    const statusDot = $('status-dot');
    const statusText = $('status-text');
    const errorMsg = $('error-msg');
    const modalErrorMsg = $('modal-error-msg');
    const sessionsBar = $('sessions-bar');

    // ========== 多会话管理器 ==========
    const sessions = new Map(); // sid -> { peer, conn, state, connected }
    let activeSessionId = null; // 当前激活的会话ID
    const STORAGE_KEY = 'spectra_sessions';

    // 从 localStorage 恢复会话列表
    function loadSavedSessions() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return saved.filter(s => s && s.length >= 4);
      } catch { return []; }
    }

    // 保存会话列表到 localStorage
    function saveSessions() {
      const sids = Array.from(sessions.keys());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sids));
    }

    // 从URL获取会话码
    const urlSession = new URLSearchParams(location.search).get('s');

    // 初始化：恢复保存的会话 或 从 URL 连接
    function init() {
      const saved = loadSavedSessions();
      if (urlSession) {
        const sid = urlSession.toUpperCase();
        sessionInput.value = sid; // 同步填入输入框
        showInitialLoading(sid);
        createSession(sid);
      } else if (saved.length === 0) {
        showInitialLanding();
      } else {
        // 如果有保存的会话，尝试连接第一个
        saved.forEach(sid => createSession(sid));
        // 默认激活第一个会话
        if (sessions.size > 0) {
          switchSession(Array.from(sessions.keys())[0]);
          showRemoteView();
        } else {
          showInitialLanding();
        }
      }
    }

    // 网页初始入口连接逻辑
    $('btn-connect').onclick = () => {
      const sid = sessionInput.value.trim().toUpperCase();
      if (!sid || sid.length < 4) return showError(errorMsg, '请输入有效会话码');
      
      showInitialLoading(sid);
      createSession(sid);
    };

    // 进入后的弹窗添加逻辑
    $('btn-modal-connect').onclick = () => {
      const sid = modalInput.value.trim().toUpperCase();
      if (!sid || sid.length < 4) return showError(modalErrorMsg, '请输入有效会话码');
      if (sessions.has(sid)) return showError(modalErrorMsg, '此会话已存在');
      
      // 弹窗连接时，直接创建，成功后会自动关闭
      createSession(sid);
      $('btn-modal-connect').disabled = true;
      $('btn-modal-connect').textContent = '连接中...';
    };

    $('close-modal').onclick = () => {
      modalPortal.classList.remove('active');
    };

    function showInitialLoading(sid) {
      initialPortal.classList.add('hidden');
      initialLoading.classList.remove('hidden');
      $('initial-loading-target').textContent = `TARGET: ${sid}`;
    }

    function hideInitialLoading() {
      initialPortal.classList.remove('hidden');
      initialLoading.classList.add('hidden');
    }
    sessionInput.onkeydown = e => {
      if (e.key === 'Enter') $('btn-connect').click();
    };


    // 创建新会话连接
    function createSession(sid) {
      if (sessions.has(sid)) return;
      
      const session = { peer: null, conn: null, state: {}, connected: false };
      sessions.set(sid, session);
      saveSessions();
      renderSessionTabs();
      
      showError('');
      statusText.textContent = `连接 ${sid}...`;
      
      session.peer = new Peer();
      session.peer.on('open', () => {
        session.conn = session.peer.connect(`spectra-${sid}`);
        session.conn.on('open', () => {
          session.connected = true;
          switchSession(sid);
          renderSessionTabs();
          showRemoteView();
          
          // 成功连接后清空状态
          modalPortal.classList.remove('active');
          $('btn-modal-connect').disabled = false;
          $('btn-modal-connect').textContent = '立即连接';
        });
        session.conn.on('data', data => {
          if (data.type === 'state') {
            session.state = { ...session.state, ...data };
            if (activeSessionId === sid) updateUI(data);
          }
        });
        session.conn.on('close', () => handleDisconnect(sid));
        session.conn.on('error', e => handleDisconnect(sid, e.message));
      });
      session.peer.on('error', e => {
        const msg = e.type === 'peer-unavailable' ? '会话不存在' : e.message;
        showError(`${sid}: ${msg}`);
        removeSession(sid);
      });
      setTimeout(() => {
        if (sessions.has(sid) && !sessions.get(sid).connected) {
          const s = sessions.get(sid);
          handleDisconnect(sid, '连接超时');
          if (modalPortal.classList.contains('active')) {
            showError(modalErrorMsg, '连接超时');
            $('btn-modal-connect').disabled = false;
          } else {
            hideInitialLoading();
            showError(errorMsg, '连接超时');
          }
          removeSession(sid);
        }
      }, 10000);
    }


    // 处理会话断开
    function handleDisconnect(sid, errMsg) {
      const s = sessions.get(sid);
      if (s) {
        s.connected = false;
        renderSessionTabs();
        if (activeSessionId === sid) statusText.textContent = errMsg ? `错误: ${errMsg}` : '已断开';
      }
    }

    // 移除会话
    function removeSession(sid) {
      const s = sessions.get(sid);
      if (s) {
        s.conn?.close();
        s.peer?.destroy();
      }
      sessions.delete(sid);
      saveSessions();
      renderSessionTabs();
      // 如果删除的是当前激活的，切换到其他
      if (activeSessionId === sid) {
        activeSessionId = null;
        const next = Array.from(sessions.keys())[0];
        if (next) switchSession(next);
        else showInitialLanding();
      }
    }

    // 切换激活会话
    function switchSession(sid) {
      if (!sessions.has(sid)) return;
      activeSessionId = sid;
      const s = sessions.get(sid);
      statusDot.classList.toggle('connected', s.connected);
      statusText.textContent = s.connected ? '已连接' : '未连接';
      $('session-badge').textContent = '🔗 ' + sid;
      updateUI(s.state);
      renderSessionTabs();
    }

    // 发送命令到当前会话
    function sendCmd(cmd) {
      if (!activeSessionId) return;
      const s = sessions.get(activeSessionId);
      if (s?.conn?.open) s.conn.send({ type: 'command', command: cmd });
    }

    function showError(elem, msg) {
      elem.textContent = msg;
    }

    // 渲染会话标签栏
    function renderSessionTabs() {
      sessionsBar.innerHTML = '';
      
      // 添加连接按钮并入横向列表
      const addBtn = document.createElement('button');
      addBtn.className = 'btn-add-session';
      addBtn.id = 'btn-add-session';
      addBtn.innerHTML = '➕ 新连接';
      addBtn.onclick = () => {
        modalPortal.classList.add('active');
        modalInput.focus();
        modalErrorMsg.textContent = '';
      };
      sessionsBar.appendChild(addBtn);

      sessions.forEach((s, sid) => {
        const tab = document.createElement('div');
        tab.className = 'session-tab' + (sid === activeSessionId ? ' active' : '') + (!s.connected ? ' disconnected' : '');
        tab.innerHTML = `${sid} <span class="close-btn">✕</span>`;
        tab.onclick = (e) => {
          if (e.target.classList.contains('close-btn')) {
            removeSession(sid);
          } else {
            switchSession(sid);
            sessionInput.value = sid; // 切换会话时同步更新输入框码
          }
        };
        sessionsBar.appendChild(tab);
      });
    }

    // 显示控制视图
    function showRemoteView() {
      portalArea.classList.add('hidden');
      controlArea.classList.remove('hidden');
      document.body.classList.add('connected');
    }

    // 重置并显示初始引导
    function showInitialLanding() {
      document.body.classList.remove('connected');
      controlArea.classList.add('hidden');
      portalArea.classList.remove('hidden');
      hideInitialLoading();
      statusDot.classList.remove('connected');
      statusText.textContent = '未连接';
    }
    
    // 初始化
    const urlSession = new URLSearchParams(location.search).get('s');
    function init() {
      const saved = loadSavedSessions();
      if (urlSession) {
        const sid = urlSession.toUpperCase();
        sessionInput.value = sid;
        showInitialLoading(sid);
        createSession(sid);
      } else if (saved.length === 0) {
        showInitialLanding();
      } else {
        // 有保存的连接，但需要用户手动选择或自动连接第一个
        showInitialLanding();
      }
    }
    init();

    // 主题切换
    const btnTheme = $('btn-theme');
    let isDark = true;
    // 从 localStorage 恢复
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light');
      btnTheme.textContent = '☀️';
      isDark = false;
    }
    btnTheme.onclick = () => {
      isDark = !isDark;
      document.documentElement.classList.toggle('light', !isDark);
      btnTheme.textContent = isDark ? '🌙' : '☀️';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    };

    // 按钮事件
    $('btn-vol-down').onclick = () => sendCmd('volume_down');
    $('btn-vol-up').onclick = () => sendCmd('volume_up');
    $('btn-vol-100').onclick = () => sendCmd('volume_100');
    $('btn-mute').onclick = () => sendCmd('mute');
    $('btn-play-pause').onclick = () => sendCmd('play_pause');
    $('btn-seek-back').onclick = () => sendCmd('seek_backward');
    $('btn-seek-forward').onclick = () => sendCmd('seek_forward');
    $('btn-seek-back-30').onclick = () => sendCmd('seek_backward_30');
    $('btn-seek-forward-30').onclick = () => sendCmd('seek_forward_30');
    $('btn-speed-down').onclick = () => sendCmd('speed_down');
    $('btn-speed-up').onclick = () => sendCmd('speed_up');
    $('btn-speed-reset').onclick = () => sendCmd('speed_reset');
    // 全屏/PiP 已移除 (浏览器安全策略需要用户手势)
  </script>
</body>
</html>
