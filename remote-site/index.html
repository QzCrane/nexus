<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPECTRA Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* 深色主题 (默认) */
    :root {
      --bg: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      --bg-solid: #0f0f1a;
      --card: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --accent: #667eea;
      --accent2: #764ba2;
      --success: #4caf50;
      --danger: #f44336;
      --text: #fff;
      --text-dim: rgba(255, 255, 255, 0.6);
    }
    /* 浅色主题 */
    :root.light {
      --bg: linear-gradient(145deg, #f5f7fa 0%, #e4e8ef 50%, #dfe5ed 100%);
      --bg-solid: #f5f7fa;
      --card: rgba(0, 0, 0, 0.04);
      --card-hover: rgba(0, 0, 0, 0.08);
      --accent: #5a67d8;
      --accent2: #6b46c1;
      --success: #38a169;
      --danger: #e53e3e;
      --text: #1a202c;
      --text-dim: rgba(26, 32, 44, 0.6);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* 垂直居中 */
      color: var(--text);
      padding: 16px;
      padding-bottom: env(safe-area-inset-bottom, 16px);
      overflow-x: hidden;
    }

    /* 已连接后顶部对齐 */
    body.connected {
      justify-content: flex-start;
    }

    /* 头部 */
    .header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .status-dot.connected { background: var(--success); }

    /* 模态遮罩 (取代原来的 view-stage) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85); /* 深色遮罩 */
      backdrop-filter: blur(8px);      /* 毛玻璃效果 */
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .modal-overlay.active { 
      display: flex; 
      opacity: 1;
    }
    
    /* 所有的模态内容容器 */
    .modal-view {
      display: none;
      width: 100%;
      max-width: 320px;
      flex-direction: column;
      align-items: center;
    }
    .modal-view.active { display: flex; }
    
    /* 连接表单卡片 */
    .connect-card {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--card);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .connect-card h2 { font-size: 18px; text-align: center; margin-bottom: 4px; }
    .connect-card p { font-size: 12px; color: var(--text-dim); text-align: center; margin-bottom: 8px; }
    
    .connect-card input {
      width: 100%;
      padding: 16px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(0,0,0,0.2);
      color: var(--text);
      font-size: 20px;
      text-align: center;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .connect-card input:focus { outline: none; border-color: var(--accent); }
    
    .btn-action {
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--text-dim);
      margin-top: 8px;
    }
    
    /* 连接中反馈 */
    .loading-content {
      text-align: center;
      animation: fadeIn 0.5s;
    }
    .loading-icon {
      font-size: 48px;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }
    .loading-text { font-size: 18px; font-weight: 600; color: var(--accent); }
    .loading-sub { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
    
    .error-msg { color: var(--danger); font-size: 13px; text-align: center; min-height: 18px; margin-top: 8px; }

    /* 遥控器界面 - 始终显示在底层 */
    .remote-view {
      display: flex;
      width: 100%;
      max-width: 320px;
      flex-direction: column;
      gap: 16px;
      padding-top: 10px; /* Reduced from 60px */
      opacity: 1;
      transition: opacity 0.3s;
    }
    /* 当模态框打开时，底层稍微变暗/模糊 (可选，这里用 opacity) */
    body.modal-open .remote-view {
      filter: blur(2px);
    }

    /* 音量显示 */
    .volume-display {
      text-align: center;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
    }
    .volume-value {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .volume-label { font-size: 12px; color: var(--text-dim); }

    /* 控制区块 */
    .control-section {
      background: var(--card);
      border-radius: 16px;
      padding: 12px;
    }
    .section-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    /* 按钮网格 */
    .btn-grid {
      display: grid;
      gap: 8px;
    }
    .btn-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .btn-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .btn-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
    .btn-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

    /* 按钮样式 */
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      background: var(--card-hover);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 60px;
    }
    .btn:active {
      transform: scale(0.95);
      background: rgba(102, 126, 234, 0.3);
    }
    .btn-label {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* 主播放按钮 */
    .btn-play {
      font-size: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      min-height: 70px;
    }

    /* 静音按钮 */
    .btn.muted { background: var(--danger); }

    /* 速度显示 */
    .speed-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    /* 标签页信息 */
    .tab-info {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
    }
    .tab-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-domain {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* 主题切换按钮 */
    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: var(--card-hover);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      z-index: 100;
      transition: transform 0.2s;
    }
    .theme-toggle:active { transform: scale(0.9); }

    /* Session Badge Removed */

    /* 会话列表栏 */
    .sessions-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
      margin-bottom: 8px;
    }
    .session-tab {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      transition: 0.2s;
    }
    .session-tab.active {
      border-color: var(--accent);
      color: var(--text);
      background: var(--card-hover);
    }
    .session-tab .active-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      margin-right: 4px;
    }
    .session-tab.disconnected {
      opacity: 0.5;
    }
    .session-tab .close-btn {
      font-size: 10px;
      opacity: 0.6;
      margin-left: 2px;
    }
    .btn-add-session {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border: 2px dashed var(--text-dim);
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .btn-add-session:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 主题切换 -->
  <button class="theme-toggle" id="btn-theme">🌙</button>

  <div class="header">
    <h1>📱 SPECTRA Remote</h1>
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Disconnected</span>
    </div>
  </div>

  <!-- 模态遮罩层 -->
  <div class="modal-overlay" id="modal-layer">
    
    <!-- View 1: Input Code -->
    <div class="modal-view" id="view-connect">
      <div class="connect-card">
        <h2>🔗 Connect SPECTRA</h2>
        <p>Enter the 6-digit code shown in the extension</p>
        <input type="text" id="session-input" placeholder="CODE" maxlength="6" autocomplete="off" inputmode="text" autocapitalize="characters">
        <button class="btn-action btn-primary" id="btn-connect">Connect Now</button>
        <button class="btn-action btn-secondary" id="btn-cancel">Cancel</button>
        <p class="error-msg" id="error-msg"></p>
      </div>
    </div>

    <!-- View 2: Loading info -->
    <div class="modal-view" id="view-loading">
      <div class="loading-content">
        <div class="loading-icon">📡</div>
        <div class="loading-text">Connecting...</div>
        <div class="loading-sub" id="loading-target">Target: -</div>
      </div>
    </div>

  </div>

  <!-- 遥控器界面 (主底层) -->
  <div class="remote-view" id="remote-view">
    <!-- 会话列表 -->
    <div class="sessions-bar" id="sessions-bar">
      <!-- 动态生成的会话标签 -->
    </div>

    <!-- Active Session Badge Removed -->

    <!-- Current Session Info -->
    <div class="tab-info" id="tab-info">
      <div class="tab-title" id="tab-title">Waiting for sync...</div>
      <div class="tab-domain" id="tab-domain">-</div>
    </div>

    <!-- Connected Badge Removed -->

    <!-- Volume -->
    <div class="volume-display">
      <div class="volume-value" id="vol-display">100%</div>
      <div class="volume-label">VOLUME</div>
    </div>

    <!-- 音量控制 -->
    <div class="control-section">
      <div class="btn-grid cols-4">
        <button class="btn" id="btn-vol-down">➖<span class="btn-label">-10</span></button>
        <button class="btn" id="btn-vol-up">➕<span class="btn-label">+10</span></button>
        <button class="btn" id="btn-vol-100">1️⃣<span class="btn-label">100%</span></button>
        <button class="btn" id="btn-mute">🔇<span class="btn-label">Mute</span></button>
      </div>
    </div>

    <!-- Playback + Seek -->
    <div class="control-section">
      <div class="btn-grid cols-5">
        <button class="btn" id="btn-seek-back-30">⏮<span class="btn-label">-30s</span></button>
        <button class="btn" id="btn-seek-back">⏪<span class="btn-label">-10s</span></button>
        <button class="btn btn-play" id="btn-play-pause">⏸</button>
        <button class="btn" id="btn-seek-forward">⏩<span class="btn-label">+10s</span></button>
        <button class="btn" id="btn-seek-forward-30">⏭<span class="btn-label">+30s</span></button>
      </div>
    </div>

    <!-- Speed Control -->
    <div class="control-section">
      <div class="section-title">Speed <span class="speed-value" id="speed-display">1.00x</span></div>
      <div class="btn-grid cols-3">
        <button class="btn" id="btn-speed-down">🐢<span class="btn-label">-0.25</span></button>
        <button class="btn" id="btn-speed-reset">🔄<span class="btn-label">Reset</span></button>
        <button class="btn" id="btn-speed-up">🐇<span class="btn-label">+0.25</span></button>
      </div>
    </div>

    <!-- 视频控制已移除（全屏/PiP需要用户手势，无法远程触发） -->
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const sessionInput = $('session-input');
    const modalLayer = $('modal-layer');
    const viewConnect = $('view-connect');
    const viewLoading = $('view-loading');
    const remoteView = $('remote-view');
    const statusDot = $('status-dot');
    const statusText = $('status-text');
    const errorMsg = $('error-msg');
    const sessionsBar = $('sessions-bar');
    const loadingTarget = $('loading-target');

    // ========== 多会话管理器 ==========
    const sessions = new Map(); // sid -> { peer, conn, state, connected }
    let activeSessionId = null; // 当前激活的会话ID
    const STORAGE_KEY = 'spectra_sessions';

    // 从 localStorage 恢复会话列表
    function loadSavedSessions() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return saved.filter(s => s && s.length >= 4);
      } catch { return []; }
    }

    // 保存会话列表到 localStorage
    function saveSessions() {
      const sids = Array.from(sessions.keys());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sids));
    }

    // 从URL获取会话码
    const urlSession = new URLSearchParams(location.search).get('s');

    // 初始化：恢复保存的会话 或 从 URL 连接
    function init() {
      const saved = loadSavedSessions();
      if (urlSession) {
        const sid = urlSession.toUpperCase();
        sessionInput.value = sid; // 同步填入输入框
        createSession(sid);
      }
      
      // If no connections, show input (forced)
      if (sessions.size === 0) {
        sessionInput.value = ''; // Clear for fresh start if not from URL
        if (urlSession) sessionInput.value = urlSession.toUpperCase();
        showConnectModal(false); 
      } else {
        renderSessionTabs();
      }
    }

    $('btn-connect').onclick = () => {
      const sid = sessionInput.value.trim().toUpperCase();
      if (!sid || sid.length < 4) return showError('Invalid Code');
      if (sessions.has(sid) && sessions.get(sid).connected) return showError('Also Connected');
      
      showLoadingModal(sid);
      createSession(sid);
    };
    $('btn-cancel').onclick = () => {
      closeModal();
    };
    sessionInput.onkeydown = e => {
      if (e.key === 'Enter') $('btn-connect').click();
    };

    // 添加新会话按钮
    // 显示连接输入页
    // 打开连接模态框
    function showConnectModal(cancellable = true) {
      modalLayer.classList.add('active');
      document.body.classList.add('modal-open');
      
      viewConnect.classList.add('active');
      viewLoading.classList.remove('active');
      
      showError('');
      // 如果可取消，显示取消按钮，否则隐藏
      $('btn-cancel').style.display = cancellable ? 'block' : 'none';
      sessionInput.focus();
    }

    // Open Loading Modal
    function showLoadingModal(sid) {
      modalLayer.classList.add('active');
      document.body.classList.add('modal-open');
      
      viewConnect.classList.remove('active');
      viewLoading.classList.add('active');
      
      loadingTarget.textContent = `Target: ${sid}`;
    }

    // 关闭模态框
    function closeModal() {
      modalLayer.classList.remove('active');
      document.body.classList.remove('modal-open');
      // 稍微延时清理 active 类，防止动画闪烁
      setTimeout(() => {
         viewConnect.classList.remove('active');
         viewLoading.classList.remove('active');
      }, 300);
    }

    // 创建新会话连接
    function createSession(sid) {
      if (sessions.has(sid)) return;
      
      const session = { peer: null, conn: null, state: {}, connected: false };
      sessions.set(sid, session);
      saveSessions();
      renderSessionTabs();
      
      showError('');
      statusText.textContent = `Connecting ${sid}...`;
      
      session.peer = new Peer();
      session.peer.on('open', () => {
        session.conn = session.peer.connect(`spectra-${sid}`);
        session.conn.on('open', () => {
          try {
            session.connected = true;
            switchSession(sid);
            renderSessionTabs();
            setTimeout(closeModal, 100); // 确保在UI更新后关闭
          } catch (err) {
            console.error(err);
            closeModal(); // 发生错误也要关闭
          }
        });
        session.conn.on('data', data => {
          if (data.type === 'state') {
            session.state = { ...session.state, ...data };
            if (activeSessionId === sid) updateUI(data);
          }
        });
        session.conn.on('close', () => handleDisconnect(sid));
        session.conn.on('error', e => handleDisconnect(sid, e.message));
      });
      session.peer.on('error', e => {
        const msg = e.type === 'peer-unavailable' ? '会话不存在' : e.message;
        showError(`${sid}: ${msg}`);
        removeSession(sid);
      });
      setTimeout(() => {
        if (sessions.has(sid) && !sessions.get(sid).connected) {
          showError(`${sid}: Timeout`);
          // Return to input
          viewLoading.classList.remove('active');
          viewConnect.classList.add('active'); 
          removeSession(sid);
        }
      }, 10000);
    }


    // 处理会话断开
    function handleDisconnect(sid, errMsg) {
      const s = sessions.get(sid);
      if (s) {
        s.connected = false;
        renderSessionTabs();
        if (activeSessionId === sid) statusText.textContent = errMsg ? `Error: ${errMsg}` : 'Disconnected';
      }
    }

    // 移除会话
    function removeSession(sid) {
      const s = sessions.get(sid);
      if (s) {
        s.conn?.close();
        s.peer?.destroy();
      }
      sessions.delete(sid);
      saveSessions();
      renderSessionTabs();
      // 如果删除的是当前激活的，切换到其他
      if (activeSessionId === sid) {
        activeSessionId = null;
        const next = sessions.keys().next().value;
        if (next) switchSession(next);
        else {
           // No connections left
           showConnectModal(false);
           statusText.textContent = 'Disconnected';
           statusDot.classList.remove('connected');
        }
      }
    }

    // 切换激活会话
    function switchSession(sid) {
      if (!sessions.has(sid)) return;
      activeSessionId = sid;
      const s = sessions.get(sid);
      statusDot.classList.toggle('connected', s.connected);
      statusText.textContent = s.connected ? 'Connected' : 'Disconnected';
      
      /* Badge update removed */
      
      updateUI(s.state);
      renderSessionTabs();
    }

    // 发送命令到当前会话
    function sendCmd(cmd) {
      if (!activeSessionId) return;
      const s = sessions.get(activeSessionId);
      if (s?.conn?.open) s.conn.send({ type: 'command', command: cmd });
    }

    function updateUI(s) {
      if (s.volume !== undefined) $('vol-display').textContent = s.volume + '%';
      if (s.muted !== undefined) $('btn-mute').classList.toggle('muted', s.muted);
      if (s.playing !== undefined) $('btn-play-pause').textContent = s.playing ? '⏸' : '▶️';
      if (s.speed !== undefined) $('speed-display').textContent = s.speed.toFixed(2) + 'x';
      if (s.tabTitle !== undefined) $('tab-title').textContent = s.tabTitle || 'Waiting...';
      if (s.tabDomain !== undefined) $('tab-domain').textContent = s.tabDomain || '-';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
    }

    // 渲染会话标签栏
    function renderSessionTabs() {
      sessionsBar.innerHTML = '';
      
      sessions.forEach((s, sid) => {
        const tab = document.createElement('div');
        tab.className = 'session-tab' + (sid === activeSessionId ? ' active' : '') + (!s.connected ? ' disconnected' : '');
        
        // Add active marker if active
        const marker = (sid === activeSessionId) ? '<span class="active-dot"></span>' : '';
        tab.innerHTML = `${marker}${sid} <span class="close-btn">✕</span>`;
        
        tab.onclick = (e) => {
          if (e.target.classList.contains('close-btn')) {
            removeSession(sid);
          } else {
            switchSession(sid);
            // Don't auto-fill input on tab switch, only on fresh scan or init
          }
        };
        sessionsBar.appendChild(tab);
      });

      // Add "New" button at the END
      const addBtn = document.createElement('button');
      addBtn.className = 'btn-add-session';
      addBtn.id = 'btn-add-session';
      addBtn.innerHTML = '➕ New';
      addBtn.onclick = () => {
        sessionInput.value = ''; // Clear input for new connection
        showConnectModal(true); 
      };
      sessionsBar.appendChild(addBtn);
    }

    // 移除旧的视图切换函数
    // showRemoteView / hideRemoteView 已不再需要，逻辑并入 modal 控制

    // 初始化
    init();

    // 主题切换
    const btnTheme = $('btn-theme');
    let isDark = true;
    // 从 localStorage 恢复
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light');
      btnTheme.textContent = '☀️';
      isDark = false;
    }
    btnTheme.onclick = () => {
      isDark = !isDark;
      document.documentElement.classList.toggle('light', !isDark);
      btnTheme.textContent = isDark ? '🌙' : '☀️';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    };

    // 按钮事件
    $('btn-vol-down').onclick = () => sendCmd('volume_down');
    $('btn-vol-up').onclick = () => sendCmd('volume_up');
    $('btn-vol-100').onclick = () => sendCmd('volume_100');
    $('btn-mute').onclick = () => sendCmd('mute');
    $('btn-play-pause').onclick = () => sendCmd('play_pause');
    $('btn-seek-back').onclick = () => sendCmd('seek_backward');
    $('btn-seek-forward').onclick = () => sendCmd('seek_forward');
    $('btn-seek-back-30').onclick = () => sendCmd('seek_backward_30');
    $('btn-seek-forward-30').onclick = () => sendCmd('seek_forward_30');
    $('btn-speed-down').onclick = () => sendCmd('speed_down');
    $('btn-speed-up').onclick = () => sendCmd('speed_up');
    $('btn-speed-reset').onclick = () => sendCmd('speed_reset');
    // 全屏/PiP 已移除 (浏览器安全策略需要用户手势)
  </script>
</body>
</html>
