<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HALO</title>
    <style>
      :root {
        --halo-bg: #1a1a1a;
        --halo-bg-secondary: #242424;
        --halo-bg-tertiary: #2a2a2a;
        --halo-text: #f0f0f0;
        --halo-text-secondary: #b0b0b0;
        --halo-text-muted: #666666;
        --halo-border: #444444;
        --halo-accent: #7c3aed;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--halo-bg);
        color: var(--halo-text);
        overflow-x: hidden;
        scroll-behavior: smooth;
        transition: background 0.2s, color 0.2s;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translate(-50%, 10px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      /* Custom Scrollbar - uses CSS vars */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--halo-border);
        border-radius: 10px;
        transition: background 0.2s;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--halo-text-muted);
      }
    </style>
    <!-- CSP-compliant: Early init (theme + smooth scroll) -->
    <script src="sidepanel-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
