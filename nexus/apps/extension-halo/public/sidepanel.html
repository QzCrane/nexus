<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HALO</title>
    <style>
      :root {
        --halo-bg: #1a1a1a;
        --halo-bg-secondary: #242424;
        --halo-bg-tertiary: #2a2a2a;
        --halo-text: #f0f0f0;
        --halo-text-secondary: #b0b0b0;
        --halo-text-muted: #666666;
        --halo-border: #444444;
        --halo-accent: #7c3aed;
        --halo-input-bg: #2a2a2a;
        --halo-card-bg: #242424;
      }
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      * {
        box-sizing: border-box;
      }
      /* Reset button default styles to prevent black box flash */
      button {
        -webkit-tap-highlight-color: transparent;
        -webkit-appearance: none;
        appearance: none;
      }
      button:focus,
      button:active {
        outline: none;
      }
      body {
        background: var(--halo-bg);
        color: var(--halo-text);
        overflow: hidden; /* Prevent body scroll */
        scroll-behavior: smooth;
        transition: background 0.2s, color 0.2s;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translate(-50%, 10px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      /* Page transition animations */
      @keyframes slideInFromRight {
        from {
          opacity: 0.5;
          transform: translateX(100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes slideInFromLeft {
        from {
          opacity: 0.5;
          transform: translateX(-100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      /* Code editor text selection - high contrast for readability */
      textarea::selection,
      pre::selection,
      code::selection {
        background: var(--halo-accent, #7c3aed);
        color: #ffffff;
      }
      /* Webkit prefix for older browsers */
      textarea::-moz-selection,
      pre::-moz-selection,
      code::-moz-selection {
        background: var(--halo-accent, #7c3aed);
        color: #ffffff;
      }
      /* Custom Scrollbar - uses CSS vars */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--halo-border);
        border-radius: 10px;
        transition: background 0.2s;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--halo-text-muted);
      }
      /* Thin scrollbar for dock bar */
      .halo-thin-scrollbar::-webkit-scrollbar {
        height: 3px;
      }
      .halo-thin-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .halo-thin-scrollbar::-webkit-scrollbar-thumb {
        background: var(--halo-border);
        border-radius: 3px;
      }
      /* Universal smooth scroll for sidepanel - always enabled */
      *,
      *::before,
      *::after {
        scroll-behavior: smooth;
      }
    </style>
    <!-- CSP-compliant: Early init (theme + smooth scroll) -->
    <script src="sidepanel-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
