<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>SPECTRA fixture: declared-adapter player</title>
<style>
	:root { color-scheme: dark; }
	body { margin: 0; min-height: 100vh; background: #0b0b0f; color: #e8e8ef; font: 14px/1.5 system-ui, sans-serif; }
	#player { position: relative; width: 720px; height: 405px; margin: 24px; background: #000; }
	#mid { width: 100%; height: 100%; }
	video { width: 100%; height: 100%; display: block; background: #000; }
	.xgplayer-playback-setting { position: absolute; right: 16px; bottom: 14px; display: flex; gap: 10px; align-items: center; padding: 4px 10px; border-radius: 6px; background: rgb(0 0 0 / 60%); }
	.xgplayer-setting-playbackRatio { font-weight: 600; }
	.xgplayer-setting-content { display: flex; gap: 6px; }
	.xgplayer-playratio-item { padding: 1px 6px; border-radius: 4px; color: #b9b9c8; }
	.xgplayer-playratio-item.select { background: #fe2c55; color: #fff; }
</style>
</head>
<body>
<!--
	Models the exact shape measured on a live douyin.com tab (2026-11-01):

	- the controller is NOT reachable from the media element — it lives on
	  `window.player`, as xgplayer's does;
	- `player.playbackRate` is an accessor over `video.playbackRate`, so a write
	  there moves the rate and reads back correctly while the panel stays put;
	- the panel is a render of `plugin.config.playBackRatio`, which only
	  `onPlayRatioChange` updates.

	A decoy with generic names sits one level closer to the video than anything
	reachable, so generic discovery picks it. The declared row has to win anyway.
-->
<div id="player">
	<div id="mid">
		<video id="v" playsinline preload="metadata"><track kind="captions" /></video>
	</div>
	<div class="xgplayer-playback-setting">
		<div class="xgplayer-setting-playbackRatio">倍速</div>
		<div class="xgplayer-setting-content">
			<div class="xgplayer-playratio-wrap" id="rates"></div>
		</div>
	</div>
</div>
<script>
	(() => {
		const mode = new URLSearchParams(location.search).get("mode") || "declared";
		const video = document.getElementById("v");
		const mid = document.getElementById("mid");
		const wrap = document.getElementById("rates");

		const RATES = ["0.75", "1.0", "1.25", "1.5", "1.75", "2.0", "3.0"];
		const items = RATES.map((rate) => {
			const el = document.createElement("div");
			el.className = "xgplayer-playratio-item";
			el.dataset.id = rate;
			el.textContent = `${rate}x`;
			wrap.appendChild(el);
			return el;
		});

		// The badge is a render of plugin state. It is never read back from
		// video.playbackRate — that is the whole point of the fixture.
		const state = { playBackRatio: 1, loginBlock: false };

		const plugin = {
			config: state,
			player: null,
			root: document.querySelector(".xgplayer-playback-setting"),
			onPlayRatioChange(value) {
				const rate = Number(value);
				if (!Number.isFinite(rate)) throw new TypeError("rate must be a number");
				this.player.config.defaultPlaybackRate = rate;
				this.player.playbackRate = rate;
				// `stale` keeps the rate moving and the panel behind: the Douyin bug.
				if (mode !== "stale") state.playBackRatio = rate;
				this.renderRoot();
			},
			renderRoot() {
				for (const el of items) {
					el.classList.toggle("select", Number(el.dataset.id) === Number(state.playBackRatio));
				}
			},
		};

		const player = {
			config: { defaultPlaybackRate: 1, playbackRate: false },
			plugins: { playbacksettingplugin: plugin },
			video,
		};
		Object.defineProperty(player, "playbackRate", {
			configurable: true,
			get() { return video.playbackRate; },
			set(value) { video.playbackRate = value; },
		});
		plugin.player = player;

		plugin.renderRoot();

		// `bare` models a page with no controller at all: the control case proving
		// the declared row is what changed the answer.
		if (mode !== "bare") {
			let decoyWrites = 0;
			mid.video = {
				video,
				speed: 1,
				getPlaybackRate() { return this.speed; },
				setPlaybackRate(value) {
					decoyWrites += 1;
					this.speed = value;
					video.playbackRate = value;
				},
			};
			window.player = player;

			window.__fixture = {
				mode,
				speed: () => state.playBackRatio,
				badge: () => items.find((el) => el.classList.contains("select"))?.textContent ?? "",
				rate: () => video.playbackRate,
				decoyWrites: () => decoyWrites,
			};
			return;
		}

		window.__fixture = {
			mode,
			speed: () => state.playBackRatio,
			badge: () => items.find((el) => el.classList.contains("select"))?.textContent ?? "",
			rate: () => video.playbackRate,
			decoyWrites: () => 0,
		};
	})();
</script>
</body>
</html>
