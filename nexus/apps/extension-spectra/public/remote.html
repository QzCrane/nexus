<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPECTRA Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 14px;
      color: #a0a0a0;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f44336;
      animation: pulse 2s infinite;
    }

    .status-dot.connected {
      background: #4caf50;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 300px;
    }

    .volume-section {
      text-align: center;
    }

    .volume-display {
      font-size: 48px;
      font-weight: 700;
      color: #667eea;
    }

    .volume-label {
      font-size: 12px;
      color: #a0a0a0;
      text-transform: uppercase;
    }

    .btn-row {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn {
      width: 70px;
      height: 70px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.95);
      background: rgba(102, 126, 234, 0.4);
    }

    .btn-large {
      width: 90px;
      height: 90px;
      font-size: 36px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .btn-mute {
      background: rgba(244, 67, 54, 0.3);
    }

    .btn-mute.active {
      background: #f44336;
    }

    .seek-section {
      margin-top: 20px;
    }

    .seek-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-seek {
      width: 60px;
      height: 50px;
      border-radius: 12px;
      font-size: 16px;
    }

    .error-msg {
      color: #f44336;
      font-size: 14px;
      text-align: center;
      margin-top: 20px;
      display: none;
    }

    .input-section {
      margin-top: 20px;
      width: 100%;
      max-width: 300px;
    }

    .input-section input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 20px;
      text-align: center;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .input-section input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn-connect {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📱 SPECTRA Remote</h1>
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">未连接</span>
    </div>
  </div>

  <!-- 连接界面 -->
  <div id="connect-view" class="input-section">
    <input type="text" id="session-input" placeholder="输入会话码" maxlength="6" autocomplete="off">
    <button class="btn-connect" id="btn-connect">连接</button>
    <p class="error-msg" id="error-msg"></p>
  </div>

  <!-- 遥控器界面 -->
  <div id="remote-view" class="controls hidden">
    <div class="volume-section">
      <div class="volume-display" id="volume-display">100%</div>
      <div class="volume-label">音量</div>
    </div>

    <div class="btn-row">
      <button class="btn" id="btn-vol-down">−</button>
      <button class="btn btn-large" id="btn-play-pause">⏸</button>
      <button class="btn" id="btn-vol-up">+</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-mute" id="btn-mute">🔇</button>
    </div>

    <div class="seek-section">
      <div class="seek-row">
        <button class="btn btn-seek" id="btn-seek-back">⏪ 10s</button>
        <button class="btn btn-seek" id="btn-seek-forward">10s ⏩</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const sessionInput = document.getElementById('session-input');
    const btnConnect = document.getElementById('btn-connect');
    const connectView = document.getElementById('connect-view');
    const remoteView = document.getElementById('remote-view');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const errorMsg = document.getElementById('error-msg');
    const volumeDisplay = document.getElementById('volume-display');

    let peer = null;
    let conn = null;

    // 从 URL 获取会话码
    const urlParams = new URLSearchParams(window.location.search);
    const sessionFromUrl = urlParams.get('s');
    if (sessionFromUrl) {
      sessionInput.value = sessionFromUrl;
      connect();
    }

    btnConnect.onclick = connect;
    sessionInput.onkeydown = (e) => { if (e.key === 'Enter') connect(); };

    function connect() {
      const sessionId = sessionInput.value.trim().toUpperCase();
      if (!sessionId || sessionId.length < 4) {
        showError('请输入有效的会话码');
        return;
      }

      showError('');
      statusText.textContent = '连接中...';

      // 创建 Peer
      peer = new Peer();

      peer.on('open', () => {
        // 连接到扩展端
        conn = peer.connect(`spectra-${sessionId}`);

        conn.on('open', () => {
          statusDot.classList.add('connected');
          statusText.textContent = '已连接';
          connectView.classList.add('hidden');
          remoteView.classList.remove('hidden');
        });

        conn.on('data', (data) => {
          if (data.type === 'state') {
            updateUI(data);
          }
        });

        conn.on('close', () => {
          disconnect();
        });

        conn.on('error', (err) => {
          showError('连接失败: ' + err.message);
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
          showError('会话不存在或已过期');
        } else {
          showError('连接错误: ' + err.message);
        }
      });

      // 超时处理
      setTimeout(() => {
        if (!conn || !conn.open) {
          showError('连接超时，请检查会话码');
        }
      }, 10000);
    }

    function disconnect() {
      statusDot.classList.remove('connected');
      statusText.textContent = '已断开';
      remoteView.classList.add('hidden');
      connectView.classList.remove('hidden');
      if (conn) conn.close();
      if (peer) peer.destroy();
      conn = null;
      peer = null;
    }

    function sendCommand(cmd) {
      if (conn && conn.open) {
        conn.send({ type: 'command', command: cmd });
      }
    }

    function updateUI(state) {
      if (state.volume !== undefined) {
        volumeDisplay.textContent = state.volume + '%';
      }
      if (state.muted !== undefined) {
        document.getElementById('btn-mute').classList.toggle('active', state.muted);
      }
      if (state.playing !== undefined) {
        document.getElementById('btn-play-pause').textContent = state.playing ? '⏸' : '▶';
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = msg ? 'block' : 'none';
    }

    // 按钮事件
    document.getElementById('btn-vol-up').onclick = () => sendCommand('volume_up');
    document.getElementById('btn-vol-down').onclick = () => sendCommand('volume_down');
    document.getElementById('btn-mute').onclick = () => sendCommand('mute');
    document.getElementById('btn-play-pause').onclick = () => sendCommand('play_pause');
    document.getElementById('btn-seek-back').onclick = () => sendCommand('seek_backward');
    document.getElementById('btn-seek-forward').onclick = () => sendCommand('seek_forward');
  </script>
</body>
</html>
